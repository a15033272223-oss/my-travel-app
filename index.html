<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TripManager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col md:flex-row">

    <button onclick="openNewTripModal()" class="md:hidden fixed bottom-6 right-6 z-50 bg-blue-600 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-2xl active:scale-90 transition-transform">
        <i class="fa-solid fa-plus"></i>
    </button>

    <aside id="sidebar" class="hidden md:flex w-64 bg-white border-r border-slate-200 flex-col">
        <div class="p-6 text-xl font-extrabold text-blue-600 border-b">TripManager</div>
        <div id="sidebar-trip-list" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
        <div class="p-4 border-t"><button onclick="openNewTripModal()" class="w-full bg-slate-800 text-white py-2 rounded-lg font-bold">建立新行程</button></div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden bg-slate-50">
        <header class="bg-white px-6 py-4 shadow-sm z-20 flex justify-between items-center">
            <h2 id="trip-title" class="text-xl font-bold">載入中...</h2>
            <nav class="flex space-x-6 text-sm font-medium">
                <button onclick="switchModule('timeline')" class="text-blue-600 border-b-2 border-blue-600 py-2">行程</button>
                <button onclick="switchModule('checklist')" class="py-2">待辦事項</button>
            </nav>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8">
            <div id="module-timeline" class="max-w-3xl mx-auto space-y-4">
                <div id="event-form" class="bg-white p-4 rounded-xl shadow-sm border space-y-2">
                    <div class="grid grid-cols-3 gap-2">
                        <input type="text" id="ev-day" placeholder="日期" class="border rounded p-2 text-sm">
                        <input type="time" id="ev-time" class="border rounded p-2 text-sm">
                        <select id="ev-type" class="border rounded p-2 text-sm">
                            <option value="general">一般</option>
                            <option value="dive">🤿 潛水</option>
                            <option value="flight">✈️ 航班</option>
                        </select>
                    </div>
                    <input type="text" id="ev-title" placeholder="標題" class="w-full border rounded p-2 text-sm">
                    <button onclick="addEvent()" class="w-full bg-blue-600 text-white py-2 rounded font-bold">加入/更新行程</button>
                    <div id="warning-box" class="hidden bg-red-100 text-red-700 text-xs p-2 rounded border border-red-200"></div>
                </div>
                <div id="itinerary-list" class="space-y-2"></div>
            </div>

            <div id="module-checklist" class="hidden max-w-3xl mx-auto space-y-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border">
                    <div class="flex gap-2">
                        <input type="text" id="check-input" class="flex-1 border rounded px-3" placeholder="新增待辦...">
                        <button onclick="addChecklist()" class="bg-blue-600 text-white px-4 py-2 rounded">新增</button>
                    </div>
                    <div id="check-list" class="mt-4 space-y-2"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let tripData = JSON.parse(localStorage.getItem('itineraries')) || [];

        // --- 核心防呆邏輯 ---
        function validateItinerary() {
            const warningBox = document.getElementById('warning-box');
            let sorted = [...tripData].sort((a,b) => new Date(`2026/${a.day} ${a.time}`) - new Date(`2026/${b.day} ${b.time}`));
            let lastDive = null;
            let error = null;

            sorted.forEach(ev => {
                let d = new Date(`2026/${ev.day} ${ev.time}`);
                if(ev.type === 'dive') lastDive = d;
                if((ev.type === 'flight') && lastDive && (d - lastDive < 86400000)) {
                    error = `❌ 時間錯亂：${ev.title} 距離潛水未滿 24 小時！`;
                }
            });

            if(error) { warningBox.innerText = error; warningBox.classList.remove('hidden'); }
            else { warningBox.classList.add('hidden'); }
        }

        function addEvent() {
            const ev = { id: Date.now(), day: document.getElementById('ev-day').value, time: document.getElementById('ev-time').value, type: document.getElementById('ev-type').value, title: document.getElementById('ev-title').value };
            tripData.push(ev);
            localStorage.setItem('itineraries', JSON.stringify(tripData));
            renderItinerary();
            validateItinerary();
        }

        function renderItinerary() {
            const list = document.getElementById('itinerary-list');
            list.innerHTML = tripData.map(ev => `
                <div class="bg-white p-3 rounded-lg shadow-sm border flex justify-between items-center group">
                    <span>${ev.day} ${ev.time} - <b>${ev.title}</b> (${ev.type})</span>
                    <button onclick="deleteEvent(${ev.id})" class="text-red-400 hover:text-red-600">刪除</button>
                </div>
            `).join('');
        }

        // --- 待辦轉 Google Tasks 模擬 ---
        function syncToGoogleTasks(text) {
            alert(`已成功同步：「${text}」到 Google Tasks！`);
            // 實際串接處：呼叫 generic_reminders:create API
        }

        function addChecklist() {
            const text = document.getElementById('check-input').value;
            const list = document.getElementById('check-list');
            list.innerHTML += `
                <div class="flex items-center gap-2 border-b py-2">
                    <input type="checkbox" onchange="syncToGoogleTasks('${text}')">
                    <span class="flex-1">${text}</span>
                </div>
            `;
            document.getElementById('check-input').value = '';
        }

        function switchModule(m) {
            document.getElementById('module-timeline').classList.toggle('hidden', m !== 'timeline');
            document.getElementById('module-checklist').classList.toggle('hidden', m !== 'checklist');
        }

        renderItinerary();
    </script>
</body>
</html>
