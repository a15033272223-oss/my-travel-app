<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的旅遊行程總管</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link class="rtl" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 flex h-screen overflow-hidden">

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col z-10 shadow-sm">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center">
            <h1 class="text-xl font-extrabold text-blue-600"><i class="fa-solid fa-plane-departure mr-2"></i>TripManager</h1>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-6">
            <div>
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">我的行程清單</h2>
                <ul id="sidebar-trip-list" class="space-y-2"></ul>
            </div>
        </div>
        <div class="p-4 border-t border-slate-200 bg-slate-50">
            <button onclick="openNewTripModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-2.5 rounded-lg text-sm font-bold shadow-sm transition-colors flex items-center justify-center">
                <i class="fa-solid fa-plus mr-2"></i>建立新行程
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden bg-slate-50 relative">
        <header class="bg-white border-b border-slate-200 px-8 py-5 flex justify-between items-center z-10">
            <div>
                <div class="flex items-center space-x-3">
                    <h2 id="trip-title" class="text-2xl font-bold text-slate-800">載入中...</h2>
                    <button onclick="deleteCurrentTrip()" class="text-slate-300 hover:text-red-500 text-sm transition-colors"><i class="fa-solid fa-trash-can"></i></button>
                </div>
                <p id="trip-dates" class="text-sm text-slate-500 mt-1">--</p>
            </div>
            <div class="flex items-center space-x-3">
                <div class="flex items-center bg-blue-50 border border-blue-200 rounded-full px-3 py-1 shadow-sm focus-within:ring-2 focus-within:ring-blue-300">
                    <i class="fa-solid fa-user-group text-blue-500 mr-2 text-xs"></i>
                    <span class="text-xs font-bold text-blue-700 mr-1">成員/旅伴:</span>
                    <input type="text" id="companionInput" class="bg-transparent border-none focus:outline-none text-sm font-medium text-slate-700 placeholder-slate-400 w-40" placeholder="以逗號分隔，如: 聖聖, 旅伴A" oninput="saveCompanion(this.value)" onchange="renderBudget()">
                </div>
            </div>
        </header>

        <div class="bg-white border-b border-slate-200 px-8 flex space-x-6 text-sm font-medium text-slate-500 z-10">
            <button onclick="switchModule('timeline')" id="tab-timeline" class="module-tab py-4 text-blue-600 border-b-2 border-blue-600 font-bold">日曆與排氮追蹤</button>
            <button onclick="switchModule('checklist')" id="tab-checklist" class="module-tab py-4 hover:text-blue-600 transition-colors">專業裝備行李</button>
            <button onclick="switchModule('budget')" id="tab-budget" class="module-tab py-4 hover:text-blue-600 transition-colors">預算與個人結算</button>
        </div>

        <div class="flex-1 overflow-y-auto p-8">
            
            <div id="module-timeline" class="module-content block space-y-6 max-w-4xl mx-auto">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <div class="text-4xl text-blue-500 bg-blue-50 p-3 rounded-lg" id="weather-icon"><i class="fa-solid fa-cloud-sun"></i></div>
                        <div>
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">目的地即時氣象資訊</h3>
                            <div class="flex items-baseline space-x-2 mt-0.5">
                                <span id="temp-display" class="text-3xl font-black text-slate-700">--°C</span>
                                <span id="weather-desc" class="text-sm font-bold text-slate-500">連線中...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                    <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center"><i class="fa-solid fa-calendar-plus mr-2 text-blue-500"></i>規劃新行程項目</h3>
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-3">
                        <input type="text" id="event-day" placeholder="日期 (例: 7/5)" class="border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                        <input type="time" id="event-time" class="border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                        <select id="event-type" class="border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none bg-white">
                            <option value="general">一般行程</option>
                            <option value="dive">🤿 水肺潛水</option>
                            <option value="altitude">✈️ 航班/高海拔</option>
                            <option value="accommodation">⛺️ 住宿基地</option>
                        </select>
                        <select id="event-status" class="border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none bg-white">
                            <option value="none">無票券狀態</option>
                            <option value="to-book">🔴 待預訂</option>
                            <option value="booked">🟢 已預訂</option>
                        </select>
                    </div>
                    <div class="flex flex-col md:flex-row gap-3">
                        <input type="text" id="event-title" placeholder="要做什麼？" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                        <input type="text" id="event-note" placeholder="備註/突發狀況" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                        <button onclick="addEvent()" class="bg-blue-600 text-white font-bold py-2 px-8 rounded-lg text-sm">加入</button>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <div id="itinerary-list" class="space-y-1"></div>
                </div>
            </div>

            <div id="module-checklist" class="module-content hidden max-w-4xl mx-auto space-y-6">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <div class="flex gap-2 mb-6">
                        <input type="text" id="newChecklistItem" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="要補帶什麼裝備嗎？">
                        <button onclick="addChecklistItem()" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-bold">新增打包項</button>
                    </div>
                    <div id="checklist-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>
            </div>

            <div id="module-budget" class="module-content hidden max-w-4xl mx-auto space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm flex flex-col justify-center text-center md:text-left">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">本次旅程總開銷</p>
                        <p class="text-4xl font-black text-slate-800" id="budget-total">$0</p>
                        <p class="text-xs text-slate-400 mt-2" id="budget-per-capita">每人平均分攤：$0</p>
                    </div>
                    
                    <div class="bg-blue-600 text-white rounded-xl p-6 shadow-md md:col-span-2">
                        <p class="text-sm font-bold uppercase tracking-wider mb-3 flex items-center">
                            <i class="fa-solid fa-comments-dollar mr-2 text-blue-200"></i> 精準清帳指令（誰該給誰多少錢）
                        </p>
                        <div id="budget-settlement" class="space-y-2 max-h-36 overflow-y-auto">
                            </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h4 class="font-bold text-sm text-slate-500 uppercase tracking-wider mb-3"><i class="fa-solid fa-users-viewfinder mr-2"></i>團員收支結算概況</h4>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-50 text-slate-500 border-b border-slate-200 font-bold">
                                    <th class="p-3">成員姓名</th>
                                    <th class="p-3 text-right">總代墊金額</th>
                                    <th class="p-3 text-right">應分攤金額</th>
                                    <th class="p-3 text-right">最終淨結算狀態</th>
                                </tr>
                            </thead>
                            <tbody id="member-summary-list" class="divide-y divide-slate-100">
                                </tbody>
                        </table>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h3 class="font-bold text-lg text-slate-800 mb-4 flex items-center"><i class="fa-solid fa-square-plus mr-2 text-emerald-500"></i>新增款項紀錄</h3>
                    <div class="flex flex-col md:flex-row gap-3 mb-6">
                        <input type="text" id="budget-title" placeholder="花費項目 (如: 租車、船票)" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                        <input type="number" id="budget-amount" placeholder="金額 (AUD)" class="w-full md:w-32 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                        <input type="text" id="budget-payer" placeholder="誰先付的？(如: 中偉)" class="w-full md:w-36 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                        <button onclick="addBudgetItem()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-lg text-sm font-bold whitespace-nowrap transition-colors">記錄一筆</button>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-50 text-slate-500 border-b border-slate-200 font-bold">
                                    <th class="p-3">項目明細</th>
                                    <th class="p-3">代墊付款人</th>
                                    <th class="p-3 text-right">金額 (AUD)</th>
                                    <th class="p-3 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="budget-list" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <div id="newTripModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 mx-4">
            <h3 class="text-lg font-bold text-slate-800 mb-4">建立全新旅程計畫</h3>
            <div class="space-y-4">
                <input type="text" id="new-trip-name" placeholder="行程目的地" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                <input type="text" id="new-trip-dates" placeholder="日期區間" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button onclick="closeNewTripModal()" class="px-4 py-2 text-sm font-medium text-slate-500">取消</button>
                <button onclick="createNewTrip()" class="px-5 py-2 text-sm font-bold bg-blue-600 text-white rounded-lg">確認建立</button>
            </div>
        </div>
    </div>

    <script>
        let currentTripKey = localStorage.getItem('activeTripKey') || 'cairns';
        
        let tripsMaster = JSON.parse(localStorage.getItem('tripsMasterV4')) || {
            'cairns': { name: '凱恩斯海陸空大探險', dates: '2026/06/28 - 2026/07/13', lat: -16.9203, lng: 145.7710, icon: 'fa-anchor' },
            'tasmania': { name: '塔斯馬尼亞自駕與露營車', dates: '2026/01/13 - 2026/01/23', lat: -42.8821, lng: 147.3272, icon: 'fa-car' }
        };
        
        let itineraries = JSON.parse(localStorage.getItem('tripItinerariesV4')) || { 
            'cairns': [
                { id: 1, day: '7/2', time: '22:25', title: 'JQ956 抵達凱恩斯機場', note: '機場深夜取車', type: 'flight', status: 'booked' },
                { id: 2, day: '7/3', time: '14:00', title: '庫蘭達熱帶雨林觀光纜車', note: '已確認下午有開放', type: 'general', status: 'to-book' },
                { id: 3, day: '7/4', time: '09:00', title: 'Mission Beach 極限高空跳傘', note: '海灘降落絕美視角，需提前確認預訂', type: 'altitude', status: 'to-book' },
                { id: 4, day: '7/5', time: '10:00', title: '大堡礁 2天1夜船宿潛水 (OceanQuest)', note: '入住海上平台', type: 'general', status: 'booked' },
                { id: 5, day: '7/5', time: '19:30', title: '大堡礁夜潛體驗', note: '看珊瑚礁夜間生態', type: 'dive', status: 'booked' },
                { id: 6, day: '7/6', time: '14:00', title: '直升機大堡礁高空俯瞰 (飛回市區)', note: 'Cruise/Fly 方案', type: 'altitude', status: 'to-book' },
                { id: 7, day: '7/7', time: '08:00', title: 'Silversonic 外海尋找小鬚鯨共遊', note: '七月限定珍貴行程', type: 'dive', status: 'booked' }
            ],
            'tasmania': [] 
        };

        // 預填凱恩斯的真實分帳多筆資料，方便測試
        let budgets = JSON.parse(localStorage.getItem('tripBudgetsV4')) || {
            'cairns': [
                { id: 1001, title: '大堡礁 OceanQuest 船宿費用', amount: 1200, payer: '中偉' },
                { id: 1002, title: 'Silversonic 小鬚鯨船票', amount: 560, payer: '聖聖' },
                { id: 1003, title: '庫蘭達纜車預訂費', amount: 240, payer: '聖聖' },
                { id: 1004, title: '租車加滿油與公路補給', amount: 160, payer: '中偉' }
            ],
            'tasmania': []
        };

        let checklists = JSON.parse(localStorage.getItem('tripChecklistsV4')) || { 'cairns': [] };

        function renderSidebar() {
            const list = document.getElementById('sidebar-trip-list');
            list.innerHTML = '';
            Object.keys(tripsMaster).forEach(key => {
                const trip = tripsMaster[key];
                const isActive = key === currentTripKey;
                list.innerHTML += `
                    <li><button onclick="selectTrip('${key}')" class="w-full text-left px-3 py-2 rounded-lg font-medium text-sm transition-colors border flex flex-col ${isActive ? 'bg-blue-50 text-blue-700 border-blue-100 font-bold' : 'text-slate-600 border-transparent hover:bg-slate-50'}">
                        <span class="flex items-center"><i class="fa-solid ${trip.icon || 'fa-map'} w-5 mr-2"></i>${trip.name}</span>
                        <span class="text-xs opacity-60 mt-1 ml-7">${trip.dates.split(' ')[0]}</span>
                    </button></li>
                `;
            });
        }

        function selectTrip(key) { currentTripKey = key; localStorage.setItem('activeTripKey', key); renderSidebar(); initCurrentTripData(); }

        function initCurrentTripData() {
            const trip = tripsMaster[currentTripKey];
            if (!trip) return;
            document.getElementById('trip-title').innerText = trip.name;
            document.getElementById('trip-dates').innerText = trip.dates;
            
            // 如果是凱恩斯且沒存過成員，自動填入 中偉, 聖聖 作為預設演示
            if (currentTripKey === 'cairns' && !localStorage.getItem(`companion_${currentTripKey}`)) {
                localStorage.setItem(`companion_${currentTripKey}`, '中偉, 聖聖');
            }
            
            document.getElementById('companionInput').value = localStorage.getItem(`companion_${currentTripKey}`) || '我';
            
            fetchWeather(trip.lat, trip.lng);
            renderItinerary(); renderChecklist(); renderBudget();
        }

        function openNewTripModal() { document.getElementById('newTripModal').classList.replace('hidden', 'flex'); }
        function closeNewTripModal() { document.getElementById('newTripModal').classList.replace('flex', 'hidden'); }
        function createNewTrip() {
            const name = document.getElementById('new-trip-name').value.trim();
            const dates = document.getElementById('new-trip-dates').value.trim();
            if (!name || !dates) return;
            const key = 'trip_' + Date.now();
            tripsMaster[key] = { name, dates, lat: -16.9203, lng: 145.7710, icon: 'fa-route' };
            itineraries[key] = []; checklists[key] = []; budgets[key] = [];
            localStorage.setItem('tripsMasterV4', JSON.stringify(tripsMaster));
            currentTripKey = key; localStorage.setItem('activeTripKey', key);
            closeNewTripModal(); renderSidebar(); initCurrentTripData();
        }
        function deleteCurrentTrip() {
            if (Object.keys(tripsMaster).length <= 1) return alert('請至少保留一個行程');
            if (confirm(`確定要刪除整个行程嗎？`)) {
                delete tripsMaster[currentTripKey];
                localStorage.setItem('tripsMasterV4', JSON.stringify(tripsMaster));
                currentTripKey = Object.keys(tripsMaster)[0];
                renderSidebar(); initCurrentTripData();
            }
        }
        function saveCompanion(value) { localStorage.setItem(`companion_${currentTripKey}`, value); }

        function renderItinerary() {
            const list = document.getElementById('itinerary-list');
            list.innerHTML = '';
            let events = itineraries[currentTripKey] || [];
            
            let lastDiveTime = null;
            let sortedEvents = [...events].sort((a, b) => new Date(`2026/${a.day} ${a.time || '00:00'}`) - new Date(`2026/${b.day} ${b.time || '00:00'}`));

            sortedEvents.forEach(item => {
                let currentEventTime = new Date(`2026/${item.day} ${item.time || '00:00'}`);
                if (item.type === 'dive') lastDiveTime = currentEventTime;
                item.warning = null;
                if ((item.type === 'flight' || item.type === 'altitude') && lastDiveTime) {
                    let diffHours = (currentEventTime - lastDiveTime) / (1000 * 60 * 60);
                    if (diffHours < 24 && diffHours >= 0) {
                        item.warning = `⚠️ 飛行安全排氮警告：距離上次潛水僅 ${diffHours.toFixed(1)} 小時，處於 24H 禁飛安全红區內！`;
                    }
                }
            });

            events.forEach(item => {
                const isAccommodation = item.type === 'accommodation';
                let typeIcon = item.type === 'dive' ? '🤿' : item.type === 'altitude' ? '🚁' : item.type === 'flight' ? '✈️' : item.type === 'accommodation' ? '⛺️' : '📍';
                let statusBadge = item.status === 'to-book' ? '<span class="ml-2 bg-red-100 text-red-700 text-[10px] font-bold px-1.5 py-0.5 rounded">待預訂</span>' : item.status === 'booked' ? '<span class="ml-2 bg-green-100 text-green-700 text-[10px] font-bold px-1.5 py-0.5 rounded">已預訂</span>' : '';
                let warningHTML = item.warning ? `<div class="mt-2 bg-red-500 text-white text-xs font-bold px-3 py-1.5 rounded animate-pulse">${item.warning}</div>` : '';

                list.innerHTML += `
                    <div data-id="${item.id}" class="relative pl-8 py-3 border-l-2 border-blue-200 ${isAccommodation?'bg-slate-800 text-white rounded-r-xl':'bg-white'} hover:opacity-95 transition-opacity group cursor-grab mb-1 shadow-sm">
                        <span class="absolute -left-[9px] top-4.5 w-4 h-4 bg-blue-500 rounded-full border-4 border-slate-100 shadow-sm"></span>
                        <div class="flex justify-between items-start">
                            <div class="w-full">
                                <div class="flex items-center space-x-2">
                                    <span class="bg-blue-100 text-blue-700 text-[11px] font-bold px-1.5 py-0.5 rounded">${item.day}</span>
                                    <span class="text-xs font-bold opacity-60">${item.time || '--:--'}</span>
                                    ${statusBadge}
                                </div>
                                <p class="font-semibold ${isAccommodation?'text-white':'text-slate-800'} text-base mt-1">${typeIcon} ${item.title}</p>
                                ${item.note ? `<p class="text-xs opacity-75 mt-1 bg-black/5 px-2 py-0.5 rounded inline-block">${item.note}</p>` : ''}
                                ${warningHTML}
                            </div>
                            <button onclick="deleteEvent(${item.id})" class="opacity-0 group-hover:opacity-100 p-2 text-slate-400 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>`;
            });
        }

        function addEvent() {
            const title = document.getElementById('event-title').value.trim();
            if (!title) return;
            itineraries[currentTripKey].push({ 
                id: Date.now(), day: document.getElementById('event-day').value, time: document.getElementById('event-time').value, 
                title, note: document.getElementById('event-note').value, type: document.getElementById('event-type').value, status: document.getElementById('event-status').value 
            });
            localStorage.setItem('tripItinerariesV4', JSON.stringify(itineraries));
            renderItinerary();
        }
        function deleteEvent(id) { itineraries[currentTripKey] = itineraries[currentTripKey].filter(i => i.id !== id); localStorage.setItem('tripItinerariesV4', JSON.stringify(itineraries)); renderItinerary(); }
        new Sortable(document.getElementById('itinerary-list'), { animation: 150, onEnd: function (evt) { const arr = itineraries[currentTripKey]; arr.splice(evt.newIndex, 0, arr.splice(evt.oldIndex, 1)[0]); localStorage.setItem('tripItinerariesV4', JSON.stringify(itineraries)); } });

        function renderChecklist() {} function addChecklistItem() {}

        // --- ★ 升級核心功能：多對多清帳自動化分帳演算法 ★ ---
        function renderBudget() {
            const list = document.getElementById('budget-list');
            const summaryTable = document.getElementById('member-summary-list');
            list.innerHTML = '';
            summaryTable.innerHTML = '';
            
            const items = budgets[currentTripKey] || [];
            
            // 1. 解析所有參與分帳的成員名單
            let participants = new Set();
            const inputNames = document.getElementById('companionInput').value.trim();
            if (inputNames) {
                inputNames.split(',').forEach(n => { if(n.trim()) participants.add(n.trim()); });
            }
            if (participants.size === 0) participants.add("我");

            let totalAmount = 0;
            let paidByPerson = {};
            participants.forEach(p => paidByPerson[p] = 0);

            // 2. 算總花費、統計每個成員實際付了多少錢
            items.forEach(item => {
                totalAmount += item.amount;
                const payer = item.payer ? item.payer.trim() : "我";
                participants.add(payer); // 若記帳時輸入了新名字，自動納入群組
                
                paidByPerson[payer] = (paidByPerson[payer] || 0) + item.amount;

                list.innerHTML += `
                    <tr class="hover:bg-slate-50/50">
                        <td class="p-3 font-medium text-slate-700">${item.title}</td>
                        <td class="p-3"><span class="bg-blue-50 text-blue-700 font-bold px-2 py-0.5 rounded text-xs">${payer}</span></td>
                        <td class="p-3 text-right font-bold text-slate-900">$${item.amount.toLocaleString()}</td>
                        <td class="p-3 text-center"><button onclick="deleteBudgetItem(${item.id})" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button></td>
                    </tr>`;
            });

            // 3. 計算平均值
            const totalMembers = participants.size;
            const perPersonShare = totalMembers > 0 ? (totalAmount / totalMembers) : 0;

            document.getElementById('budget-total').innerText = '$' + Math.round(totalAmount).toLocaleString();
            document.getElementById('budget-per-capita').innerText = `全員共 ${totalMembers} 人，每人平均分攤：$${Math.round(perPersonShare).toLocaleString()}`;

            if (totalAmount === 0) {
                document.getElementById('budget-settlement').innerHTML = '<span class="text-blue-100 text-sm">目前無任何開銷，暫不需分帳。</span>';
                return;
            }

            // 4. 計算每個人的淨結算差額 (代墊款 - 應分攤)
            let balances = {};
            participants.forEach(member => {
                const paid = paidByPerson[member] || 0;
                const net = paid - perPersonShare;
                balances[member] = net;

                // 渲染「團員收支結算概況」表格
                let statusHTML = '';
                if (net > 0.01) statusHTML = `<span class="text-emerald-600 font-bold">可收回 $${Math.round(net).toLocaleString()}</span>`;
                else if (net < -0.01) statusHTML = `<span class="text-red-500 font-bold">需支付 $${Math.round(Math.abs(net)).toLocaleString()}</span>`;
                else statusHTML = `<span class="text-slate-400">已兩清</span>`;

                summaryTable.innerHTML += `
                    <tr class="hover:bg-slate-50/50">
                        <td class="p-3 font-semibold text-slate-700">${member}</td>
                        <td class="p-3 text-right text-slate-600">$${Math.round(paid).toLocaleString()}</td>
                        <td class="p-3 text-right text-slate-600">$${Math.round(perPersonShare).toLocaleString()}</td>
                        <td class="p-3 text-right">${statusHTML}</td>
                    </tr>`;
            });

            // 5. 核心多對多清帳最小化簡化演算法
            let debtors = [];  // 負債方 (淨額為負)
            let creditors = []; // 債權方 (淨額為正)

            for (const [person, netBalance] of Object.entries(balances)) {
                if (netBalance < -0.01) debtors.push({ person, amount: Math.abs(netBalance) });
                else if (netBalance > 0.01) creditors.push({ person, amount: netBalance });
            }

            let settlementText = '';
            let i = 0, j = 0;

            while (i < debtors.length && j < creditors.length) {
                let d = debtors[i];
                let c = creditors[j];
                let amountToPay = Math.min(d.amount, c.amount);

                settlementText += `
                    <div class="flex justify-between items-center bg-white/10 px-4 py-2 rounded-lg border border-white/10 shadow-sm text-sm">
                        <span><i class="fa-solid fa-arrow-right-arrow-left mr-1.5 opacity-70"></i> <b>${d.person}</b> 應轉帳給 <b>${c.person}</b></span>
                        <span class="font-black text-base text-yellow-200">$${Math.round(amountToPay).toLocaleString()} AUD</span>
                    </div>`;

                d.amount -= amountToPay;
                c.amount -= amountToPay;
                if (d.amount < 0.01) i++;
                if (c.amount < 0.01) j++;
            }

            document.getElementById('budget-settlement').innerHTML = settlementText || '<span class="text-white font-medium">所有人分攤剛好，互不相欠！</span>';
        }

        function addBudgetItem() {
            const title = document.getElementById('budget-title').value.trim();
            const amount = parseFloat(document.getElementById('budget-amount').value);
            const payer = document.getElementById('budget-payer').value.trim() || '我';
            if (!title || isNaN(amount)) return alert('請完整輸入項目與金額');
            
            if (!budgets[currentTripKey]) budgets[currentTripKey] = [];
            budgets[currentTripKey].push({ id: Date.now(), title, amount, payer });
            localStorage.setItem('tripBudgetsV4', JSON.stringify(budgets));
            
            document.getElementById('budget-title').value = '';
            document.getElementById('budget-amount').value = '';
            document.getElementById('budget-payer').value = '';
            renderBudget();
        }

        function deleteBudgetItem(id) { budgets[currentTripKey] = budgets[currentTripKey].filter(i => i.id !== id); localStorage.setItem('tripBudgetsV4', JSON.stringify(budgets)); renderBudget(); }

        async function fetchWeather(lat, lng) {
            if (!lat || !lng) return;
            try {
                document.getElementById('temp-display').innerText = '--°C';
                document.getElementById('weather-desc').innerText = '連線中...';
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`);
                const data = await response.json();
                document.getElementById('temp-display').innerText = `${data.current_weather.temperature}°C`;
                document.getElementById('weather-desc').innerText = data.current_weather.weathercode <= 3 ? '多雲時晴' : '有降雨機率';
            } catch (e) { document.getElementById('weather-desc').innerText = '讀取逾時'; }
        }

        function switchModule(m) { 
            document.querySelectorAll('.module-content').forEach(e => e.classList.replace('block', 'hidden')); 
            document.getElementById('module-'+m).classList.replace('hidden', 'block'); 
            document.querySelectorAll('.module-tab').forEach(e => e.classList.remove('text-blue-600', 'border-b-2', 'font-bold')); 
            document.getElementById('tab-'+m).classList.add('text-blue-600', 'border-b-2', 'font-bold'); 
        }

        renderSidebar(); initCurrentTripData();
    </script>
</body>
</html>
