<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TripManager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>.no-scrollbar::-webkit-scrollbar { display: none; }</style>
</head>
<body class="bg-slate-50 h-screen flex flex-col md:flex-row font-sans">

    <button onclick="openModal('newTrip')" class="md:hidden fixed bottom-6 right-6 z-50 bg-blue-600 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-2xl active:scale-90 transition-transform">
        <i class="fa-solid fa-plus"></i>
    </button>

    <aside id="sidebar" class="fixed md:relative z-40 w-64 h-full bg-white border-r -translate-x-full md:translate-x-0 transition-transform duration-300 shadow-xl md:shadow-none flex flex-col">
        <div class="p-6 font-bold text-blue-600 border-b flex justify-between">TripManager <button onclick="toggleSidebar()" class="md:hidden"><i class="fa-solid fa-xmark"></i></button></div>
        <div id="trip-list" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="p-4 bg-white border-b flex items-center shadow-sm z-20">
            <button onclick="toggleSidebar()" class="md:hidden mr-4 text-xl"><i class="fa-solid fa-bars"></i></button>
            <h2 id="current-title" class="font-bold text-lg truncate flex-1">載入中...</h2>
            <input type="text" id="companion-input" class="w-24 text-right text-sm bg-transparent outline-none" placeholder="旅伴(逗號分隔)" onchange="saveCompanion(this.value)">
        </header>

        <div class="flex bg-white border-b text-sm">
            <button onclick="switchTab('timeline')" class="flex-1 py-3 font-bold border-b-2 border-blue-600 text-blue-600">行程</button>
            <button onclick="switchModule('checklist')" class="flex-1 py-3 text-slate-500">待辦</button>
            <button onclick="switchModule('budget')" class="flex-1 py-3 text-slate-500">分帳</button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-4">
            <div id="tab-timeline" class="module">
                <div class="bg-white p-4 rounded-xl border shadow-sm">
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <input type="text" id="ev-day" placeholder="日期 (7/5)" class="border rounded p-2 text-sm" oninput="checkSafety()">
                        <input type="time" id="ev-time" class="border rounded p-2 text-sm" oninput="checkSafety()">
                    </div>
                    <select id="ev-type" class="w-full border rounded p-2 text-sm mb-2" onchange="checkSafety()">
                        <option value="general">一般</option><option value="dining">🍽️ 餐飲</option><option value="dive">🤿 潛水</option><option value="flight">✈️ 航班/高空</option>
                    </select>
                    <input type="text" id="ev-title" placeholder="要做什麼？" class="w-full border rounded p-2 text-sm mb-2">
                    <button id="submit-btn" onclick="submitEvent()" class="w-full bg-blue-600 text-white py-2 rounded font-bold text-sm">加入/更新行程</button>
                    <div id="alert-box" class="hidden mt-2 bg-red-500 text-white text-xs p-2 rounded"></div>
                </div>
                <div id="itinerary-list" class="space-y-2"></div>
            </div>

            <div id="module-checklist" class="module hidden">
                <div class="bg-white p-4 rounded-xl border shadow-sm">
                    <div class="flex gap-2 mb-4">
                        <input type="text" id="check-input" class="flex-1 border rounded px-2" placeholder="新任務...">
                        <button onclick="addChecklist()" class="bg-blue-600 text-white px-4 py-2 rounded">新增</button>
                    </div>
                    <div id="check-list" class="space-y-2"></div>
                </div>
            </div>

            <div id="module-budget" class="module hidden">
                <div class="bg-white p-4 rounded-xl border shadow-sm">
                    <div class="text-2xl font-bold mb-2" id="budget-total">$0</div>
                    <div id="budget-settlement" class="text-sm bg-blue-50 p-2 rounded"></div>
                    <div class="mt-4 flex gap-2">
                        <input type="text" id="bud-title" placeholder="項目" class="flex-1 border rounded p-1">
                        <input type="number" id="bud-amt" placeholder="金額" class="w-20 border rounded p-1">
                        <button onclick="addBudget()" class="bg-emerald-600 text-white px-2 rounded">記錄</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="newTripModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl p-6 w-full max-w-sm"><input type="text" id="new-name" placeholder="目的地" class="w-full border p-2 rounded mb-2"><button onclick="createNewTrip()" class="w-full bg-blue-600 text-white py-2 rounded">建立</button></div>
    </div>

    <script>
        let appData = JSON.parse(localStorage.getItem('appDataV9')) || { current: 'cairns', data: { 'cairns': { itinerary:[], checklist:[], budgets:[], companions:[] } } };
        let editingId = null;

        function save() { localStorage.setItem('appDataV9', JSON.stringify(appData)); render(); }

        // --- 防呆與渲染 ---
        function checkSafety() {
            const box = document.getElementById('alert-box');
            let list = appData.data[appData.current].itinerary;
            let lastDive = null, err = null;
            list.forEach(ev => {
                let d = new Date(`2026/${ev.day} ${ev.time}`);
                if(ev.type === 'dive') lastDive = d;
                if(ev.type === 'flight' && lastDive && (d - lastDive < 86400000)) err = `⚠️ 注意：潛水後24小時內禁飛！`;
            });
            box.innerText = err || ""; box.classList.toggle('hidden', !err);
        }

        function submitEvent() {
            const ev = { id: editingId || Date.now(), day: document.getElementById('ev-day').value, time: document.getElementById('ev-time').value, type: document.getElementById('ev-type').value, title: document.getElementById('ev-title').value };
            let list = appData.data[appData.current].itinerary;
            if(editingId) { let idx = list.findIndex(e => e.id === editingId); list[idx] = ev; editingId = null; }
            else { list.push(ev); }
            save();
        }

        function editEvent(id) {
            editingId = id;
            let ev = appData.data[appData.current].itinerary.find(e => e.id === id);
            document.getElementById('ev-day').value = ev.day;
            document.getElementById('ev-time').value = ev.time;
            document.getElementById('ev-type').value = ev.type;
            document.getElementById('ev-title').value = ev.title;
            document.getElementById('submit-btn').innerText = "儲存更新";
        }

        function render() {
            document.getElementById('itinerary-list').innerHTML = (appData.data[appData.current].itinerary || []).map(ev => `
                <div class="bg-white p-3 rounded border flex justify-between items-center group">
                    <span>${ev.day} ${ev.time} <b>${ev.title}</b></span>
                    <div>
                        <button onclick="editEvent(${ev.id})" class="text-blue-400 mr-2"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteEvent(${ev.id})" class="text-red-400"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
            checkSafety();
        }

        // --- 基本功能 ---
        function deleteEvent(id) { appData.data[appData.current].itinerary = appData.data[appData.current].itinerary.filter(e => e.id !== id); save(); }
        function addChecklist() { /* 同前版本邏輯 */ }
        function addBudget() { /* 同前版本邏輯 */ }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('sidebar-overlay').classList.toggle('hidden'); }
        function openModal() { document.getElementById('newTripModal').classList.replace('hidden', 'flex'); }
        function createNewTrip() { let name = document.getElementById('new-name').value; appData.data[name] = { itinerary:[], checklist:[], budgets:[] }; appData.current = name; save(); location.reload(); }
        function switchModule(m) { /* 切換邏輯 */ }
        function saveCompanion(val) { /* 儲存旅伴 */ }
        render();
    </script>
</body>
</html>
