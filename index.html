<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人專屬旅遊管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .checked-item { text-decoration: line-through; color: #9ca3af; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <header class="bg-blue-600 text-white p-6 shadow-md">
        <h1 class="text-2xl font-bold">即將到來的旅程：峇里島潛水與自然探索</h1>
        <p class="text-sm mt-2 opacity-80">出發日期：2026年6月29日 | 協作人：聖聖</p>
    </header>

    <div class="flex border-b border-gray-200 bg-white shadow-sm sticky top-0">
        <button onclick="switchTab('itinerary')" class="flex-1 py-4 font-semibold text-gray-500 hover:text-blue-500 tab-btn" id="btn-itinerary">行程表</button>
        <button onclick="switchTab('equipment')" class="flex-1 py-4 font-semibold text-blue-600 border-b-2 border-blue-600 tab-btn" id="btn-equipment">裝備清單</button>
    </div>

    <main class="max-w-md mx-auto mt-6 p-4">

        <div id="itinerary" class="tab-content space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold text-slate-700 mb-2">6/29 (一) 抵達與安頓</h2>
                <div class="relative pl-4 border-l-2 border-blue-200 space-y-4">
                    <div class="relative">
                        <span class="absolute -left-6 top-1 w-3 h-3 bg-blue-500 rounded-full"></span>
                        <p class="text-sm font-bold text-blue-600">18:30</p>
                        <p class="font-medium">晚餐時間</p>
                        <p class="text-xs bg-yellow-100 text-yellow-800 p-1 rounded mt-1 inline-block">🍽️ 備註：避開含牛肉、蛋奶之餐點</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="equipment" class="tab-content active bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold text-slate-700 mb-4">行前裝備檢查</h2>
            
            <div class="flex gap-2 mb-6">
                <input type="text" id="newItemInput" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="新增裝備 (例如：配重頸圈...)">
                <button onclick="addItem()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition-colors">新增</button>
            </div>
            
            <div id="equipmentList" class="space-y-2">
            </div>
        </div>

    </main>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                el.classList.add('text-gray-500');
            });
            document.getElementById(tabId).classList.add('active');
            const activeBtn = document.getElementById('btn-' + tabId);
            activeBtn.classList.remove('text-gray-500');
            activeBtn.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
        }

        let equipmentData = JSON.parse(localStorage.getItem('myTripEquipment')) || [
            { id: 1, text: 'DJI Action 5 Pro 與防水殼', checked: false },
            { id: 2, text: '面鏡與長蛙鞋', checked: false },
            { id: 3, text: '個人藥品與護照', checked: false }
        ];

        function renderEquipment() {
            const list = document.getElementById('equipmentList');
            list.innerHTML = ''; 
            
            equipmentData.forEach(item => {
                list.innerHTML += `
                    <label class="flex items-center space-x-3 cursor-pointer p-2 hover:bg-slate-50 rounded-lg transition-colors border border-transparent hover:border-slate-100">
                        <input type="checkbox" class="w-5 h-5 text-blue-600 rounded" 
                               ${item.checked ? 'checked' : ''} 
                               onchange="toggleItem(${item.id})">
                        <span class="text-slate-700 ${item.checked ? 'checked-item' : ''}">${item.text}</span>
                        <button onclick="deleteItem(${item.id})" class="ml-auto text-xs text-red-400 hover:text-red-600 hidden md:block">刪除</button>
                    </label>
                `;
            });
        }

        function addItem() {
            const input = document.getElementById('newItemInput');
            const text = input.value.trim(); 
            
            if (text !== '') {
                equipmentData.push({ id: Date.now(), text: text, checked: false });
                input.value = ''; 
                saveData();       
                renderEquipment(); 
            }
        }

        function toggleItem(id) {
            const item = equipmentData.find(i => i.id === id);
            if (item) {
                item.checked = !item.checked; 
                saveData();
                renderEquipment();
            }
        }

        function deleteItem(id) {
            equipmentData = equipmentData.filter(i => i.id !== id);
            saveData();
            renderEquipment();
        }

        function saveData() {
            localStorage.setItem('myTripEquipment', JSON.stringify(equipmentData));
        }

        renderEquipment();
        
        document.getElementById('newItemInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addItem();
        });
    </script>
</body>
</html>
