<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TripManager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col md:flex-row overflow-hidden font-sans">

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden"></div>

    <aside id="mobile-sidebar" class="fixed md:relative z-50 w-64 h-full bg-white border-r -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col shadow-2xl md:shadow-none">
        <div class="p-6 font-bold text-blue-600 border-b flex justify-between">TripManager Pro <button onclick="toggleSidebar()" class="md:hidden"><i class="fa-solid fa-xmark"></i></button></div>
        <div id="sidebar-trip-list" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
        <button onclick="openNewTripModal()" class="m-4 bg-slate-900 text-white py-3 rounded-lg text-sm font-bold shadow-md">建立新旅程</button>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="p-4 bg-white border-b flex items-center shadow-sm z-20">
            <button onclick="toggleSidebar()" class="md:hidden mr-4 text-xl"><i class="fa-solid fa-bars"></i></button>
            <div class="flex-1 min-w-0">
                <h2 id="trip-title" class="font-bold text-lg truncate">載入中...</h2>
            </div>
            <input type="text" id="companionInput" class="w-24 text-right text-sm bg-transparent outline-none" placeholder="旅伴(逗號分隔)" onchange="saveCompanion(this.value); renderBudget()">
        </header>

        <div class="flex-1 overflow-y-auto p-4 space-y-6">
            <div id="event-form" class="bg-white p-4 rounded-xl border shadow-sm">
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <input type="text" id="ev-day" placeholder="日期 (例: 7/5)" class="border rounded p-2 text-sm" oninput="checkLiveWarning()">
                    <input type="time" id="ev-time" class="border rounded p-2 text-sm" oninput="checkLiveWarning()">
                </div>
                <select id="ev-type" class="w-full border rounded p-2 text-sm mb-2" onchange="checkLiveWarning()">
                    <option value="general">一般行程</option><option value="dining">🍽️ 餐飲</option><option value="dive">🤿 潛水</option><option value="flight">✈️ 航班/高空</option>
                </select>
                <input type="text" id="ev-title" placeholder="要做什麼？" class="w-full border rounded p-2 text-sm mb-2">
                <button id="submit-btn" onclick="submitEvent()" class="w-full bg-blue-600 text-white py-2 rounded font-bold text-sm">加入行程</button>
                <div id="alert-box" class="hidden mt-2 bg-red-500 text-white text-xs p-2 rounded"></div>
            </div>

            <div id="itinerary-list" class="space-y-2"></div>
        </div>
    </main>

    <div id="newTripModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl p-6 w-full max-w-sm">
            <input type="text" id="new-name" placeholder="目的地名稱" class="w-full border p-2 rounded mb-2">
            <button onclick="createNewTrip()" class="w-full bg-blue-600 text-white py-2 rounded">確認</button>
        </div>
    </div>

    <script>
        let data = JSON.parse(localStorage.getItem('tripDataV8')) || { currentId: 'cairns', trips: { 'cairns': [] }, budgets: { 'cairns': [] } };
        let editingId = null;

        function save() { localStorage.setItem('tripDataV8', JSON.stringify(data)); render(); }

        function checkLiveWarning() {
            const alertBox = document.getElementById('alert-box');
            let list = data.trips[data.currentId] || [];
            let lastDive = null, error = null;
            list.forEach(ev => {
                let d = new Date(`2026/${ev.day} ${ev.time}`);
                if(ev.type === 'dive') lastDive = d;
                if(ev.type === 'flight' && lastDive && (d - lastDive < 86400000)) error = `⚠️ 潛水禁飛警告！`;
            });
            alertBox.innerText = error || "";
            alertBox.classList.toggle('hidden', !error);
        }

        function submitEvent() {
            const ev = { 
                id: editingId || Date.now(), 
                day: document.getElementById('ev-day').value, 
                time: document.getElementById('ev-time').value, 
                type: document.getElementById('ev-type').value, 
                title: document.getElementById('ev-title').value 
            };
            if(editingId) {
                let idx = data.trips[data.currentId].findIndex(e => e.id === editingId);
                data.trips[data.currentId][idx] = ev;
                editingId = null;
            } else {
                if(!data.trips[data.currentId]) data.trips[data.currentId] = [];
                data.trips[data.currentId].push(ev);
            }
            save();
        }

        function editEvent(id) {
            editingId = id;
            let ev = data.trips[data.currentId].find(e => e.id === id);
            document.getElementById('ev-day').value = ev.day;
            document.getElementById('ev-time').value = ev.time;
            document.getElementById('ev-type').value = ev.type;
            document.getElementById('ev-title').value = ev.title;
            document.getElementById('submit-btn').innerText = "儲存更新";
        }

        function deleteEvent(id) { data.trips[data.currentId] = data.trips[data.currentId].filter(e => e.id !== id); save(); }
        function render() {
            document.getElementById('itinerary-list').innerHTML = (data.trips[data.currentId] || []).map(ev => `
                <div class="bg-white p-3 rounded border flex justify-between items-center group">
                    <span>${ev.day} ${ev.time} <b>${ev.title}</b></span>
                    <div>
                        <button onclick="editEvent(${ev.id})" class="text-blue-400 mr-2"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteEvent(${ev.id})" class="text-red-400"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
            checkSafety();
        }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('sidebar-overlay').classList.toggle('hidden'); }
        function openModal() { document.getElementById('newTripModal').classList.replace('hidden', 'flex'); }
        function createNewTrip() { 
            let name = document.getElementById('new-name').value;
            data.trips[name] = []; data.currentId = name; save(); location.reload();
        }
        render();
    </script>
</body>
</html>
