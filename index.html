<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的旅遊行程總管</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        /* 讓手機版選單可以隱藏醜醜的捲軸，但依然可以滑動 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex h-screen overflow-hidden relative">

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity md:hidden"></div>

    <aside id="mobile-sidebar" class="absolute z-50 h-full w-64 transform -translate-x-full transition-transform duration-300 md:relative md:translate-x-0 bg-white border-r border-slate-200 flex flex-col shadow-xl md:shadow-sm">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center">
            <h1 class="text-xl font-extrabold text-blue-600"><i class="fa-solid fa-plane-departure mr-2"></i>TripManager</h1>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-slate-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-6 no-scrollbar">
            <div>
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">我的行程清單</h2>
                <ul id="sidebar-trip-list" class="space-y-2"></ul>
            </div>
        </div>
        <div class="p-4 border-t border-slate-200 bg-slate-50">
            <button onclick="openNewTripModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-2.5 rounded-lg text-sm font-bold shadow-sm transition-colors flex items-center justify-center">
                <i class="fa-solid fa-plus mr-2"></i>建立新行程
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden bg-slate-50 w-full relative">
        <header class="bg-white border-b border-slate-200 px-4 md:px-8 py-4 flex justify-between items-center z-10 flex-shrink-0">
            <div class="flex items-center min-w-0">
                <button onclick="toggleSidebar()" class="md:hidden mr-4 text-slate-500 hover:text-blue-600 text-xl"><i class="fa-solid fa-bars"></i></button>
                
                <div class="min-w-0">
                    <div class="flex items-center space-x-2 md:space-x-3">
                        <h2 id="trip-title" class="text-lg md:text-2xl font-bold text-slate-800 truncate">載入中...</h2>
                        <button onclick="deleteCurrentTrip()" class="text-slate-300 hover:text-red-500 text-sm transition-colors flex-shrink-0"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <p id="trip-dates" class="text-xs md:text-sm text-slate-500 mt-0.5 truncate">--</p>
                </div>
            </div>
            
            <div class="flex items-center ml-2 flex-shrink-0">
                <div class="flex items-center bg-blue-50 border border-blue-200 rounded-full px-2 md:px-3 py-1 shadow-sm focus-within:ring-2 focus-within:ring-blue-300">
                    <i class="fa-solid fa-user-group text-blue-500 mr-1 md:mr-2 text-xs"></i>
                    <span class="hidden md:inline text-xs font-bold text-blue-700 mr-1">成員/旅伴:</span>
                    <input type="text" id="companionInput" class="bg-transparent border-none focus:outline-none text-xs md:text-sm font-medium text-slate-700 placeholder-slate-400 w-16 md:w-32" placeholder="如: 聖聖" oninput="saveCompanion(this.value)" onchange="renderBudget()">
                </div>
            </div>
        </header>

        <div class="bg-white border-b border-slate-200 px-4 md:px-8 flex space-x-4 md:space-x-6 text-sm font-medium text-slate-500 z-10 overflow-x-auto no-scrollbar whitespace-nowrap flex-shrink-0">
            <button onclick="switchModule('timeline')" id="tab-timeline" class="module-tab py-4 text-blue-600 border-b-2 border-blue-600 font-bold">日曆與行程</button>
            <button onclick="switchModule('checklist')" id="tab-checklist" class="module-tab py-4 hover:text-blue-600 transition-colors">專業裝備行李</button>
            <button onclick="switchModule('budget')" id="tab-budget" class="module-tab py-4 hover:text-blue-600 transition-colors">預算與個人結算</button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 md:p-8">
            
            <div id="module-timeline" class="module-content block space-y-4 md:space-y-6 max-w-4xl mx-auto">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 md:p-5 flex items-center justify-between">
                    <div class="flex items-center space-x-3 md:space-x-4">
                        <div class="text-3xl md:text-4xl text-blue-500 bg-blue-50 p-2 md:p-3 rounded-lg" id="weather-icon"><i class="fa-solid fa-cloud-sun"></i></div>
                        <div>
                            <h3 class="text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-wider">目的地即時氣象</h3>
                            <div class="flex items-baseline space-x-2">
                                <span id="temp-display" class="text-2xl md:text-3xl font-black text-slate-700">--°C</span>
                                <span id="weather-desc" class="text-xs md:text-sm font-bold text-slate-500">連線中...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 md:p-5">
                    <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center"><i class="fa-solid fa-calendar-plus mr-2 text-blue-500"></i>規劃新行程</h3>
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-2 mb-2">
                        <input type="text" id="event-day" placeholder="日期(7/5)" class="border border-slate-300 rounded-lg px-2 md:px-3 py-2 text-xs md:text-sm outline-none">
                        <input type="time" id="event-time" class="border border-slate-300 rounded-lg px-2 md:px-3 py-2 text-xs md:text-sm outline-none">
                        <select id="event-type" class="border border-slate-300 rounded-lg px-2 md:px-3 py-2 text-xs md:text-sm outline-none bg-white">
                            <option value="general">一般</option><option value="dive">🤿 潛水</option><option value="altitude">✈️ 航班/高空</option><option value="accommodation">⛺️ 住宿</option>
                        </select>
                        <select id="event-status" class="col-span-2 md:col-span-1 border border-slate-300 rounded-lg px-2 md:px-3 py-2 text-xs md:text-sm outline-none bg-white">
                            <option value="none">無票券</option><option value="to-book">🔴 待定</option><option value="booked">🟢 已定</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-2">
                        <input type="text" id="event-title" placeholder="做什麼？" class="border border-slate-300 rounded-lg px-2 md:px-3 py-2 text-xs md:text-sm outline-none">
                        <input type="text" id="event-note" placeholder="備註" class="border border-slate-300 rounded-lg px-2 md:px-3 py-2 text-xs md:text-sm outline-none">
                        <button onclick="addEvent()" class="bg-blue-600 text-white font-bold py-2 rounded-lg text-sm w-full">加入</button>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 md:p-6">
                    <div id="itinerary-list" class="space-y-1"></div>
                </div>
            </div>

            <div id="module-checklist" class="module-content hidden max-w-4xl mx-auto space-y-6">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <div class="flex flex-col md:flex-row gap-2 mb-6">
                        <input type="text" id="newChecklistItem" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="要補帶什麼裝備嗎？">
                        <button onclick="addChecklistItem()" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-bold">新增打包項</button>
                    </div>
                    <div id="checklist-container" class="grid grid-cols-1 gap-4"></div>
                </div>
            </div>

            <div id="module-budget" class="module-content hidden max-w-4xl mx-auto space-y-4 md:space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm text-center md:text-left">
                        <p class="text-xs font-bold text-slate-400 uppercase">本次總開銷</p>
                        <p class="text-3xl md:text-4xl font-black text-slate-800" id="budget-total">$0</p>
                        <p class="text-xs text-slate-400 mt-1" id="budget-per-capita">平均分攤：$0</p>
                    </div>
                    <div class="bg-blue-600 text-white rounded-xl p-5 shadow-md md:col-span-2">
                        <p class="text-sm font-bold uppercase mb-2 flex items-center"><i class="fa-solid fa-comments-dollar mr-2"></i> 精準清帳指令</p>
                        <div id="budget-settlement" class="space-y-2 text-sm md:text-base"></div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 md:p-6">
                    <h4 class="font-bold text-sm text-slate-500 uppercase mb-3"><i class="fa-solid fa-users-viewfinder mr-2"></i>收支結算概況</h4>
                    <div class="overflow-x-auto no-scrollbar">
                        <table class="w-full text-left border-collapse text-xs md:text-sm whitespace-nowrap">
                            <thead>
                                <tr class="bg-slate-50 text-slate-500 border-b border-slate-200 font-bold">
                                    <th class="p-2 md:p-3">成員</th><th class="p-2 md:p-3 text-right">代墊</th><th class="p-2 md:p-3 text-right">應攤</th><th class="p-2 md:p-3 text-right">結算狀態</th>
                                </tr>
                            </thead>
                            <tbody id="member-summary-list" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 md:p-6">
                    <h3 class="font-bold text-base md:text-lg text-slate-800 mb-3 flex items-center"><i class="fa-solid fa-square-plus mr-2 text-emerald-500"></i>記一筆新的</h3>
                    <div class="flex flex-col gap-2 mb-4">
                        <input type="text" id="budget-title" placeholder="花費項目" class="border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" id="budget-amount" placeholder="金額" class="border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                            <input type="text" id="budget-payer" placeholder="代墊人" class="border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                        </div>
                        <button onclick="addBudgetItem()" class="bg-emerald-600 text-white py-2 rounded-lg text-sm font-bold w-full">記錄</button>
                    </div>
                    
                    <div class="overflow-x-auto no-scrollbar">
                        <table class="w-full text-left border-collapse text-xs md:text-sm whitespace-nowrap">
                            <thead>
                                <tr class="bg-slate-50 text-slate-500 border-b border-slate-200 font-bold">
                                    <th class="p-2 md:p-3">項目</th><th class="p-2 md:p-3">代墊</th><th class="p-2 md:p-3 text-right">金額</th><th class="p-2 md:p-3 text-center">刪</th>
                                </tr>
                            </thead>
                            <tbody id="budget-list" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <div id="newTripModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-5">
            <h3 class="text-lg font-bold text-slate-800 mb-4">建立全新旅程計畫</h3>
            <div class="space-y-3">
                <input type="text" id="new-trip-name" placeholder="行程目的地" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                <input type="text" id="new-trip-dates" placeholder="日期區間" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
            </div>
            <div class="flex justify-end space-x-3 mt-5">
                <button onclick="closeNewTripModal()" class="px-4 py-2 text-sm font-medium text-slate-500">取消</button>
                <button onclick="createNewTrip()" class="px-5 py-2 text-sm font-bold bg-blue-600 text-white rounded-lg">確認建立</button>
            </div>
        </div>
    </div>

    <script>
        let currentTripKey = localStorage.getItem('activeTripKey') || 'cairns';
        
        let tripsMaster = JSON.parse(localStorage.getItem('tripsMasterV5')) || {
            'cairns': { name: '凱恩斯海陸空大探險', dates: '2026/06/28 - 2026/07/13', lat: -16.9203, lng: 145.7710, icon: 'fa-anchor' },
            'tasmania': { name: '塔斯馬尼亞自駕與露營車', dates: '2026/01/13 - 2026/01/23', lat: -42.8821, lng: 147.3272, icon: 'fa-car' }
        };
        
        let itineraries = JSON.parse(localStorage.getItem('tripItinerariesV5')) || { 
            'cairns': [
                { id: 1, day: '7/2', time: '22:25', title: 'JQ956 抵達凱恩斯機場', note: '深夜取車', type: 'flight', status: 'booked' },
                { id: 2, day: '7/3', time: '14:00', title: '庫蘭達熱帶雨林觀光', note: '已確認下午開放', type: 'general', status: 'to-book' },
                { id: 3, day: '7/4', time: '09:00', title: 'Mission Beach 跳傘', note: '需提前確認', type: 'altitude', status: 'to-book' },
                { id: 4, day: '7/5', time: '10:00', title: '大堡礁 2天1夜船宿', note: '海上平台', type: 'general', status: 'booked' },
                { id: 5, day: '7/5', time: '19:30', title: '大堡礁夜潛', note: '看珊瑚礁生態', type: 'dive', status: 'booked' },
                { id: 6, day: '7/6', time: '14:00', title: '直升機飛回市區', note: 'Cruise/Fly 方案', type: 'altitude', status: 'to-book' },
                { id: 7, day: '7/7', time: '08:00', title: '尋找小鬚鯨共遊', note: '七月限定', type: 'dive', status: 'booked' }
            ],
            'tasmania': [] 
        };

        let budgets = JSON.parse(localStorage.getItem('tripBudgetsV5')) || {
            'cairns': [
                { id: 1001, title: '船宿費用', amount: 1200, payer: '中偉' },
                { id: 1002, title: '小鬚鯨船票', amount: 560, payer: '聖聖' },
                { id: 1003, title: '纜車費', amount: 240, payer: '聖聖' }
            ],
            'tasmania': []
        };

        let checklists = JSON.parse(localStorage.getItem('tripChecklistsV5')) || { 'cairns': [] };

        // --- 手機版側邊欄控制 ---
        let isSidebarOpen = false;
        function toggleSidebar() {
            const sidebar = document.getElementById('mobile-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            isSidebarOpen = !isSidebarOpen;
            if (isSidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function renderSidebar() {
            const list = document.getElementById('sidebar-trip-list');
            list.innerHTML = '';
            Object.keys(tripsMaster).forEach(key => {
                const trip = tripsMaster[key];
                const isActive = key === currentTripKey;
                list.innerHTML += `
                    <li><button onclick="selectTrip('${key}')" class="w-full text-left px-3 py-2 rounded-lg font-medium text-sm transition-colors border flex flex-col ${isActive ? 'bg-blue-50 text-blue-700 border-blue-100 font-bold' : 'text-slate-600 border-transparent hover:bg-slate-50'}">
                        <span class="flex items-center"><i class="fa-solid ${trip.icon || 'fa-map'} w-5 mr-2"></i>${trip.name}</span>
                        <span class="text-xs opacity-60 mt-1 ml-7">${trip.dates.split(' ')[0]}</span>
                    </button></li>
                `;
            });
        }

        function selectTrip(key) { 
            currentTripKey = key; localStorage.setItem('activeTripKey', key); 
            renderSidebar(); initCurrentTripData(); 
            // 選擇行程後，自動收起手機版選單
            if (window.innerWidth < 768 && isSidebarOpen) toggleSidebar();
        }

        function initCurrentTripData() {
            const trip = tripsMaster[currentTripKey];
            if (!trip) return;
            document.getElementById('trip-title').innerText = trip.name;
            document.getElementById('trip-dates').innerText = trip.dates;
            
            if (currentTripKey === 'cairns' && !localStorage.getItem(`companion_${currentTripKey}`)) localStorage.setItem(`companion_${currentTripKey}`, '中偉, 聖聖');
            document.getElementById('companionInput').value = localStorage.getItem(`companion_${currentTripKey}`) || '我';
            
            fetchWeather(trip.lat, trip.lng);
            renderItinerary(); renderChecklist(); renderBudget();
        }

        function openNewTripModal() { document.getElementById('newTripModal').classList.replace('hidden', 'flex'); }
        function closeNewTripModal() { document.getElementById('newTripModal').classList.replace('flex', 'hidden'); }
        function createNewTrip() {
            const name = document.getElementById('new-trip-name').value.trim();
            const dates = document.getElementById('new-trip-dates').value.trim();
            if (!name || !dates) return;
            const key = 'trip_' + Date.now();
            tripsMaster[key] = { name, dates, lat: -16.9203, lng: 145.7710, icon: 'fa-route' };
            itineraries[key] = []; checklists[key] = []; budgets[key] = [];
            localStorage.setItem('tripsMasterV5', JSON.stringify(tripsMaster));
            currentTripKey = key; localStorage.setItem('activeTripKey', key);
            closeNewTripModal(); renderSidebar(); initCurrentTripData();
            if (window.innerWidth < 768 && isSidebarOpen) toggleSidebar();
        }
        function deleteCurrentTrip() {
            if (Object.keys(tripsMaster).length <= 1) return alert('至少保留一個');
            if (confirm(`確定刪除？`)) {
                delete tripsMaster[currentTripKey]; localStorage.setItem('tripsMasterV5', JSON.stringify(tripsMaster));
                currentTripKey = Object.keys(tripsMaster)[0]; renderSidebar(); initCurrentTripData();
            }
        }
        function saveCompanion(value) { localStorage.setItem(`companion_${currentTripKey}`, value); }

        function renderItinerary() {
            const list = document.getElementById('itinerary-list');
            list.innerHTML = '';
            let events = itineraries[currentTripKey] || [];
            let lastDiveTime = null;
            let sortedEvents = [...events].sort((a, b) => new Date(`2026/${a.day} ${a.time || '00:00'}`) - new Date(`2026/${b.day} ${b.time || '00:00'}`));

            sortedEvents.forEach(item => {
                let currentEventTime = new Date(`2026/${item.day} ${item.time || '00:00'}`);
                if (item.type === 'dive') lastDiveTime = currentEventTime;
                item.warning = null;
                if ((item.type === 'flight' || item.type === 'altitude') && lastDiveTime) {
                    let diffHours = (currentEventTime - lastDiveTime) / (1000 * 60 * 60);
                    if (diffHours < 24 && diffHours >= 0) item.warning = `⚠️ 距離潛水僅 ${diffHours.toFixed(1)} 小時，處於 24H 禁飛區內！`;
                }
            });

            events.forEach(item => {
                const isAcc = item.type === 'accommodation';
                let typeIcon = item.type === 'dive' ? '🤿' : item.type === 'altitude' ? '🚁' : item.type === 'flight' ? '✈️' : item.type === 'accommodation' ? '⛺️' : '📍';
                let statusBadge = item.status === 'to-book' ? '<span class="ml-1 md:ml-2 bg-red-100 text-red-700 text-[10px] font-bold px-1.5 py-0.5 rounded">待訂</span>' : item.status === 'booked' ? '<span class="ml-1 md:ml-2 bg-green-100 text-green-700 text-[10px] font-bold px-1.5 py-0.5 rounded">已訂</span>' : '';
                let warningHTML = item.warning ? `<div class="mt-1 md:mt-2 bg-red-500 text-white text-[10px] md:text-xs font-bold px-2 py-1 rounded animate-pulse">${item.warning}</div>` : '';

                list.innerHTML += `
                    <div data-id="${item.id}" class="relative pl-6 md:pl-8 py-2 md:py-3 border-l-2 border-blue-200 ${isAcc?'bg-slate-800 text-white rounded-r-xl':'bg-white'} mb-1 shadow-sm group">
                        <span class="absolute -left-[9px] top-4 md:top-4.5 w-4 h-4 bg-blue-500 rounded-full border-4 border-slate-100"></span>
                        <div class="flex justify-between items-start">
                            <div class="w-full pr-2">
                                <div class="flex items-center space-x-1 md:space-x-2">
                                    <span class="bg-blue-100 text-blue-700 text-[10px] md:text-[11px] font-bold px-1 py-0.5 rounded">${item.day}</span>
                                    <span class="text-[10px] md:text-xs font-bold opacity-60">${item.time || '--:--'}</span>
                                    ${statusBadge}
                                </div>
                                <p class="font-semibold ${isAcc?'text-white':'text-slate-800'} text-sm md:text-base mt-1 leading-snug">${typeIcon} ${item.title}</p>
                                ${item.note ? `<p class="text-[10px] md:text-xs opacity-75 mt-1 bg-black/5 px-1.5 md:px-2 py-0.5 rounded inline-block">${item.note}</p>` : ''}
                                ${warningHTML}
                            </div>
                            <button onclick="deleteEvent(${item.id})" class="text-slate-300 hover:text-red-500 p-1"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>`;
            });
        }

        function addEvent() {
            const title = document.getElementById('event-title').value.trim();
            if (!title) return;
            itineraries[currentTripKey].push({ 
                id: Date.now(), day: document.getElementById('event-day').value, time: document.getElementById('event-time').value, 
                title, note: document.getElementById('event-note').value, type: document.getElementById('event-type').value, status: document.getElementById('event-status').value 
            });
            localStorage.setItem('tripItinerariesV5', JSON.stringify(itineraries));
            renderItinerary();
        }
        function deleteEvent(id) { itineraries[currentTripKey] = itineraries[currentTripKey].filter(i => i.id !== id); localStorage.setItem('tripItinerariesV5', JSON.stringify(itineraries)); renderItinerary(); }
        new Sortable(document.getElementById('itinerary-list'), { animation: 150, handle: '.group', onEnd: function (evt) { const arr = itineraries[currentTripKey]; arr.splice(evt.newIndex, 0, arr.splice(evt.oldIndex, 1)[0]); localStorage.setItem('tripItinerariesV5', JSON.stringify(itineraries)); } });

        function renderChecklist() {} function addChecklistItem() {}

        function renderBudget() {
            const list = document.getElementById('budget-list');
            const summaryTable = document.getElementById('member-summary-list');
            list.innerHTML = ''; summaryTable.innerHTML = '';
            const items = budgets[currentTripKey] || [];
            
            let participants = new Set();
            const inputNames = document.getElementById('companionInput').value.trim();
            if (inputNames) inputNames.split(',').forEach(n => { if(n.trim()) participants.add(n.trim()); });
            if (participants.size === 0) participants.add("我");

            let totalAmount = 0; let paidByPerson = {};
            participants.forEach(p => paidByPerson[p] = 0);

            items.forEach(item => {
                totalAmount += item.amount;
                const payer = item.payer ? item.payer.trim() : "我";
                participants.add(payer);
                paidByPerson[payer] = (paidByPerson[payer] || 0) + item.amount;

                list.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-2 md:p-3 font-medium text-slate-700">${item.title}</td>
                        <td class="p-2 md:p-3"><span class="bg-blue-50 text-blue-700 font-bold px-1.5 py-0.5 rounded text-[10px] md:text-xs">${payer}</span></td>
                        <td class="p-2 md:p-3 text-right font-bold text-slate-900">$${item.amount.toLocaleString()}</td>
                        <td class="p-2 md:p-3 text-center"><button onclick="deleteBudgetItem(${item.id})" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button></td>
                    </tr>`;
            });

            const totalMembers = participants.size;
            const perPersonShare = totalMembers > 0 ? (totalAmount / totalMembers) : 0;
            document.getElementById('budget-total').innerText = '$' + Math.round(totalAmount).toLocaleString();
            document.getElementById('budget-per-capita').innerText = `每人平均分攤：$${Math.round(perPersonShare).toLocaleString()}`;

            if (totalAmount === 0) {
                document.getElementById('budget-settlement').innerHTML = '<span class="text-blue-100 text-sm">無開銷，不需分帳。</span>';
                return;
            }

            let balances = {};
            participants.forEach(member => {
                const paid = paidByPerson[member] || 0;
                const net = paid - perPersonShare;
                balances[member] = net;

                let statusHTML = net > 0.01 ? `<span class="text-emerald-600 font-bold">收 $${Math.round(net).toLocaleString()}</span>` : net < -0.01 ? `<span class="text-red-500 font-bold">付 $${Math.round(Math.abs(net)).toLocaleString()}</span>` : `<span class="text-slate-400">兩清</span>`;
                summaryTable.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-2 md:p-3 font-semibold text-slate-700">${member}</td>
                        <td class="p-2 md:p-3 text-right text-slate-600">$${Math.round(paid).toLocaleString()}</td>
                        <td class="p-2 md:p-3 text-right text-slate-600">$${Math.round(perPersonShare).toLocaleString()}</td>
                        <td class="p-2 md:p-3 text-right">${statusHTML}</td>
                    </tr>`;
            });

            let debtors = [], creditors = [];
            for (const [person, netBalance] of Object.entries(balances)) {
                if (netBalance < -0.01) debtors.push({ person, amount: Math.abs(netBalance) });
                else if (netBalance > 0.01) creditors.push({ person, amount: netBalance });
            }

            let settlementText = '', i = 0, j = 0;
            while (i < debtors.length && j < creditors.length) {
                let d = debtors[i], c = creditors[j], amountToPay = Math.min(d.amount, c.amount);
                settlementText += `
                    <div class="flex justify-between items-center bg-white/10 px-3 py-1.5 rounded border border-white/10 shadow-sm text-xs md:text-sm">
                        <span><b>${d.person}</b> 給 <b>${c.person}</b></span>
                        <span class="font-black text-yellow-200">$${Math.round(amountToPay).toLocaleString()}</span>
                    </div>`;
                d.amount -= amountToPay; c.amount -= amountToPay;
                if (d.amount < 0.01) i++; if (c.amount < 0.01) j++;
            }
            document.getElementById('budget-settlement').innerHTML = settlementText || '<span class="text-white font-medium">互不相欠！</span>';
        }

        function addBudgetItem() {
            const title = document.getElementById('budget-title').value.trim();
            const amount = parseFloat(document.getElementById('budget-amount').value);
            const payer = document.getElementById('budget-payer').value.trim() || '我';
            if (!title || isNaN(amount)) return alert('輸入不完整');
            budgets[currentTripKey].push({ id: Date.now(), title, amount, payer });
            localStorage.setItem('tripBudgetsV5', JSON.stringify(budgets));
            document.getElementById('budget-title').value = ''; document.getElementById('budget-amount').value = ''; document.getElementById('budget-payer').value = '';
            renderBudget();
        }
        function deleteBudgetItem(id) { budgets[currentTripKey] = budgets[currentTripKey].filter(i => i.id !== id); localStorage.setItem('tripBudgetsV5', JSON.stringify(budgets)); renderBudget(); }

        async function fetchWeather(lat, lng) {
            if (!lat || !lng) return;
            try {
                document.getElementById('temp-display').innerText = '--°C'; document.getElementById('weather-desc').innerText = '連線中...';
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`);
                const data = await response.json();
                document.getElementById('temp-display').innerText = `${data.current_weather.temperature}°C`;
                document.getElementById('weather-desc').innerText = data.current_weather.weathercode <= 3 ? '多雲時晴' : '有降雨機率';
            } catch (e) { document.getElementById('weather-desc').innerText = '讀取逾時'; }
        }

        function switchModule(m) { 
            document.querySelectorAll('.module-content').forEach(e => e.classList.replace('block', 'hidden')); 
            document.getElementById('module-'+m).classList.replace('hidden', 'block'); 
            document.querySelectorAll('.module-tab').forEach(e => e.classList.remove('text-blue-600', 'border-b-2', 'font-bold')); 
            document.getElementById('tab-'+m).classList.add('text-blue-600', 'border-b-2', 'font-bold'); 
        }

        renderSidebar(); initCurrentTripData();
    </script>
</body>
