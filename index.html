<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的旅遊行程總管</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 flex h-screen overflow-hidden">

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col z-10">
        <div class="p-6 border-b border-slate-100">
            <h1 class="text-xl font-extrabold text-blue-600"><i class="fa-solid fa-plane-departure mr-2"></i>TripManager</h1>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 space-y-6">
            <div>
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">即將到來</h2>
                <ul class="space-y-2">
                    <li>
                        <button onclick="loadTrip(this, 'bali', '峇里島潛水與自然探索', '2026/06/29 - 2026/07/12 (共14天)', -8.4095, 115.1889)" class="sidebar-trip w-full text-left px-3 py-2 bg-blue-50 text-blue-700 rounded-lg font-medium text-sm transition-colors border border-blue-100">
                            <i class="fa-solid fa-water w-5 text-center mr-1"></i> 峇里島潛水與自然探索
                            <span class="block text-xs opacity-70 mt-1 ml-6">2026/06/29</span>
                        </button>
                    </li>
                    <li>
                        <button onclick="loadTrip(this, 'thai', '泰國 Tomorrowland', '2026/12/09 - 2026/12/18 (共10天)', 12.9236, 100.8825)" class="sidebar-trip w-full text-left px-3 py-2 text-slate-600 hover:bg-slate-50 rounded-lg font-medium text-sm transition-colors border border-transparent">
                            <i class="fa-solid fa-music w-5 text-center mr-1"></i> 泰國 Tomorrowland 
                            <span class="block text-xs opacity-70 mt-1 ml-6">2026/12/09</span>
                        </button>
                    </li>
                </ul>
            </div>

            <div>
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">歷史行程</h2>
                <ul class="space-y-2">
                    <li>
                        <button onclick="loadTrip(this, 'tasmania', '塔斯馬尼亞自駕遊', '2026/01/13 - 2026/01/23 (共11天)', -42.8821, 147.3272)" class="sidebar-trip w-full text-left px-3 py-2 text-slate-600 hover:bg-slate-50 rounded-lg font-medium text-sm transition-colors border border-transparent">
                            <i class="fa-solid fa-car w-5 text-center mr-1"></i> 塔斯馬尼亞自駕遊
                            <span class="block text-xs opacity-70 mt-1 ml-6">2026/01/13</span>
                        </button>
                    </li>
                    <li>
                        <button onclick="loadTrip(this, 'maldives', '馬爾地夫潛水行', '2025/04/25 - 2025/04/28 (共4天)', 3.9416, 73.4904)" class="sidebar-trip w-full text-left px-3 py-2 text-slate-600 hover:bg-slate-50 rounded-lg font-medium text-sm transition-colors border border-transparent">
                            <i class="fa-solid fa-fish-fins w-5 text-center mr-1"></i> 馬爾地夫潛水行
                            <span class="block text-xs opacity-70 mt-1 ml-6">2025/04/25</span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
        
        <div class="p-4 border-t border-slate-200">
            <button class="w-full bg-slate-800 hover:bg-slate-700 text-white py-2 rounded-lg text-sm font-bold shadow-sm transition-colors">
                <i class="fa-solid fa-plus mr-2"></i>建立新行程
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden bg-slate-50 relative">
        <header class="bg-white border-b border-slate-200 px-8 py-5 flex justify-between items-center z-10 shadow-sm">
            <div>
                <h2 id="trip-title" class="text-2xl font-bold text-slate-800">峇里島潛水與自然探索</h2>
                <p id="trip-dates" class="text-sm text-slate-500 mt-1">2026/06/29 - 2026/07/12 (共14天)</p>
            </div>
            
            <div class="flex items-center space-x-3">
                <span class="bg-green-100 text-green-700 px-3 py-1.5 rounded-full text-xs font-bold flex items-center shadow-sm">
                    <i class="fa-solid fa-cloud-sun mr-1"></i>天氣預測已更新
                </span>
                
                <div class="flex items-center bg-blue-50 border border-blue-200 rounded-full px-3 py-1 shadow-sm transition-all focus-within:ring-2 focus-within:ring-blue-300">
                    <i class="fa-solid fa-user-group text-blue-500 mr-2 text-xs"></i>
                    <span class="text-xs font-bold text-blue-700 mr-1">旅伴:</span>
                    <input type="text" id="companionInput" class="bg-transparent border-none focus:outline-none text-sm font-medium text-slate-700 placeholder-slate-400 w-28" placeholder="輸入同行者..." oninput="saveCompanion(this.value)">
                </div>
            </div>
        </header>

        <div class="bg-white border-b border-slate-200 px-8 flex space-x-6 text-sm font-medium text-slate-500 z-10">
            <button onclick="switchModule('timeline')" id="tab-timeline" class="module-tab py-4 text-blue-600 border-b-2 border-blue-600 font-bold">日曆視圖</button>
            <button onclick="switchModule('checklist')" id="tab-checklist" class="module-tab py-4 hover:text-blue-600 transition-colors">裝備清單</button>
            <button onclick="switchModule('map')" id="tab-map" class="module-tab py-4 hover:text-blue-600 transition-colors">交通與地圖</button>
            <button onclick="switchModule('budget')" id="tab-budget" class="module-tab py-4 hover:text-blue-600 transition-colors">預算與分帳</button>
        </div>

        <div class="flex-1 overflow-y-auto p-8">
            
            <div id="module-timeline" class="module-content block space-y-6 max-w-4xl mx-auto">
                
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex items-center justify-between">
                    <div>
                        <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-1">當地即時天氣</h3>
                        <div class="flex items-end space-x-2">
                            <span id="temp-display" class="text-4xl font-extrabold text-slate-700">--°C</span>
                            <span id="weather-desc" class="text-lg font-medium text-slate-500 mb-1">載入中...</span>
                        </div>
                    </div>
                    <div class="text-5xl text-blue-400" id="weather-icon"><i class="fa-solid fa-cloud-arrow-down animate-bounce"></i></div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h3 class="text-sm font-bold text-slate-700 mb-4 border-b pb-2"><i class="fa-solid fa-pen-to-square mr-2"></i>新增行程節點</h3>
                    <div class="flex flex-col md:flex-row gap-3">
                        <input type="time" id="event-time" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <input type="text" id="event-title" placeholder="行程名稱 (例如：前往圖蘭奔潛點)" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <input type="text" id="event-note" placeholder="備註 (選填)" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <button onclick="addEvent()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow-sm transition-colors whitespace-nowrap">新增</button>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <p class="text-xs text-slate-400 mb-4 text-right"><i class="fa-solid fa-hand-pointer mr-1"></i>提示：您可以直接用滑鼠拖曳下方行程來改變順序</p>
                    
                    <div id="itinerary-list" class="space-y-1 ml-2">
                        </div>
                </div>
            </div>

            <div id="module-checklist" class="module-content hidden max-w-4xl mx-auto"><div class="bg-white rounded-xl shadow-sm border border-slate-200 p-12 text-center text-slate-500"><i class="fa-solid fa-clipboard-list text-4xl mb-4 text-slate-300"></i><h3 class="text-base font-bold text-slate-600">裝備清單模組 (準備搬移舊程式碼)</h3></div></div>
            <div id="module-map" class="module-content hidden max-w-4xl mx-auto"><div class="bg-white rounded-xl shadow-sm border border-slate-200 p-12 text-center text-slate-500"><i class="fa-solid fa-map-location-dot text-4xl mb-4 text-slate-300"></i><h3 class="text-base font-bold text-slate-600">Google Maps 整合準備中</h3></div></div>
            <div id="module-budget" class="module-content hidden max-w-4xl mx-auto"><div class="bg-white rounded-xl shadow-sm border border-slate-200 p-12 text-center text-slate-500"><i class="fa-solid fa-file-invoice-dollar text-4xl mb-4 text-slate-300"></i><h3 class="text-base font-bold text-slate-600">分帳演算法開發中</h3></div></div>
        </div>
    </main>

    <script>
        // 旅伴記憶功能
        const savedCompanion = localStorage.getItem('currentTripCompanion');
        const companionInput = document.getElementById('companionInput');
        if (savedCompanion) companionInput.value = savedCompanion;
        function saveCompanion(value) { localStorage.setItem('currentTripCompanion', value); }

        // --- 行程資料庫與編輯邏輯 ---
        let currentTripId = 'bali'; // 預設載入峇里島
        
        // 從瀏覽器讀取行程資料，若無則建立預設值
        let itineraryData = JSON.parse(localStorage.getItem('tripItineraries')) || {
            'bali': [
                { id: 101, time: '14:30', title: '抵達伍拉·賴國際機場', note: '預約包車接送' },
                { id: 102, time: '18:30', title: '晚餐時間', note: '避開含牛肉、蛋奶之餐點' }
            ],
            'thai': [],
            'tasmania': [],
            'maldives': []
        };

        // 渲染行程時間軸
        function renderItinerary() {
            const list = document.getElementById('itinerary-list');
            list.innerHTML = ''; // 清空畫面
            
            const events = itineraryData[currentTripId] || [];
            
            if (events.length === 0) {
                list.innerHTML = `<div class="text-center py-8 text-slate-400 font-medium">目前還沒有安排行程，從上方新增一個吧！</div>`;
                return;
            }

            events.forEach(item => {
                list.innerHTML += `
                    <div data-id="${item.id}" class="relative pl-6 py-4 border-l-2 border-blue-200 bg-white hover:bg-slate-50 transition-colors group cursor-grab">
                        <span class="absolute -left-[9px] top-5 w-4 h-4 bg-blue-500 rounded-full border-4 border-white shadow-sm"></span>
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-sm font-bold text-blue-600">${item.time || '--:--'}</p>
                                <p class="font-medium text-slate-800 text-lg">${item.title}</p>
                                ${item.note ? `<p class="text-xs text-slate-500 mt-1 bg-slate-100 px-2 py-1 rounded inline-block"><i class="fa-regular fa-comment-dots mr-1"></i>${item.note}</p>` : ''}
                            </div>
                            <button onclick="deleteEvent(${item.id})" class="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity px-2">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // 新增行程功能
        function addEvent() {
            const timeInput = document.getElementById('event-time').value;
            const titleInput = document.getElementById('event-title').value.trim();
            const noteInput = document.getElementById('event-note').value.trim();

            if (!titleInput) {
                alert('行程名稱不能為空喔！');
                return;
            }

            // 建立新節點資料
            const newEvent = {
                id: Date.now(), // 用時間戳記當作唯一 ID
                time: timeInput,
                title: titleInput,
                note: noteInput
            };

            // 如果該國家還沒有陣列，就建立一個
            if (!itineraryData[currentTripId]) {
                itineraryData[currentTripId] = [];
            }

            // 加入陣列並存檔
            itineraryData[currentTripId].push(newEvent);
            localStorage.setItem('tripItineraries', JSON.stringify(itineraryData));
            
            // 清空輸入框並重新渲染畫面
            document.getElementById('event-time').value = '';
            document.getElementById('event-title').value = '';
            document.getElementById('event-note').value = '';
            renderItinerary();
        }

        // 刪除行程功能
        function deleteEvent(id) {
            if (confirm('確定要刪除這個行程嗎？')) {
                itineraryData[currentTripId] = itineraryData[currentTripId].filter(item => item.id !== id);
                localStorage.setItem('tripItineraries', JSON.stringify(itineraryData));
                renderItinerary();
            }
        }

        // 啟動拖曳排序功能 (SortableJS)
        new Sortable(document.getElementById('itinerary-list'), {
            animation: 150,
            ghostClass: 'bg-blue-50', // 拖曳時的背景色
            onEnd: function (evt) {
                // 當拖曳結束時，更新陣列順序並存檔
                const events = itineraryData[currentTripId];
                const movedItem = events.splice(evt.oldIndex, 1)[0];
                events.splice(evt.newIndex, 0, movedItem);
                
                localStorage.setItem('tripItineraries', JSON.stringify(itineraryData));
            }
        });

        // 左側選單切換邏輯 (修改版：加入 tripId 切換)
        function loadTrip(btnElement, tripId, title, dates, lat, lng) {
            currentTripId = tripId; // 更新當前編輯的國家 ID
            
            document.getElementById('trip-title').innerText = title;
            document.getElementById('trip-dates').innerText = dates;
            fetchWeather(lat, lng);

            document.querySelectorAll('.sidebar-trip').forEach(el => {
                el.classList.remove('bg-blue-50', 'text-blue-700', 'border-blue-100');
                el.classList.add('text-slate-600', 'border-transparent');
                el.querySelector('span').classList.replace('text-blue-400', 'opacity-70');
            });
            btnElement.classList.remove('text-slate-600', 'border-transparent');
            btnElement.classList.add('bg-blue-50', 'text-blue-700', 'border-blue-100');
            btnElement.querySelector('span').classList.replace('opacity-70', 'text-blue-400');

            // 切換國家後，重新渲染專屬的行程表
            renderItinerary();
        }

        // 天氣 API 串接
        async function fetchWeather(lat = -8.4095, lng = 115.1889) {
            try {
                document.getElementById('temp-display').innerText = '--°C';
                document.getElementById('weather-desc').innerText = '載入中...';
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`);
                const data = await response.json();
                const temp = data.current_weather.temperature;
                const weatherCode = data.current_weather.weathercode;
                document.getElementById('temp-display').innerText = `${temp}°C`;
                
                const descElement = document.getElementById('weather-desc');
                const iconElement = document.getElementById('weather-icon');
                if (weatherCode === 0) { descElement.innerText = '晴朗無雲'; iconElement.innerHTML = '<i class="fa-solid fa-sun text-yellow-400"></i>'; }
                else if (weatherCode <= 3) { descElement.innerText = '多雲時晴'; iconElement.innerHTML = '<i class="fa-solid fa-cloud-sun text-slate-400"></i>'; }
                else { descElement.innerText = '有降雨機率'; iconElement.innerHTML = '<i class="fa-solid fa-cloud-showers-heavy text-blue-400"></i>'; }
            } catch (error) {
                console.error("天氣抓取失敗", error);
                document.getElementById('weather-desc').innerText = '天氣更新失敗';
            }
        }

        // 頁籤切換邏輯
        function switchModule(moduleId) {
            document.querySelectorAll('.module-content').forEach(el => { el.classList.remove('block'); el.classList.add('hidden'); });
            document.getElementById('module-' + moduleId).classList.remove('hidden'); document.getElementById('module-' + moduleId).classList.add('block');
            document.querySelectorAll('.module-tab').forEach(el => { el.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600', 'font-bold'); el.classList.add('hover:text-blue-600'); });
            const activeTab = document.getElementById('tab-' + moduleId); activeTab.classList.remove('hover:text-blue-600'); activeTab.classList.add('text-blue-600', 'border-b-2', 'border-blue-600', 'font-bold');
        }

        // 網頁首次載入時執行
        fetchWeather();
        renderItinerary();
    </script>
</body>
</html>
