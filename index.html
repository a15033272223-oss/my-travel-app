<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的旅遊行程總管</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 flex h-screen overflow-hidden">

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col z-10 shadow-sm">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center">
            <h1 class="text-xl font-extrabold text-blue-600"><i class="fa-solid fa-plane-departure mr-2"></i>TripManager</h1>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-6">
            <div>
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">我的行程清單</h2>
                <ul id="sidebar-trip-list" class="space-y-2"></ul>
            </div>
        </div>
        <div class="p-4 border-t border-slate-200 bg-slate-50">
            <button onclick="openNewTripModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-2.5 rounded-lg text-sm font-bold shadow-sm transition-colors flex items-center justify-center">
                <i class="fa-solid fa-plus mr-2"></i>建立新行程
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden bg-slate-50 relative">
        <header class="bg-white border-b border-slate-200 px-8 py-5 flex justify-between items-center z-10">
            <div>
                <div class="flex items-center space-x-3">
                    <h2 id="trip-title" class="text-2xl font-bold text-slate-800">載入中...</h2>
                    <button onclick="deleteCurrentTrip()" class="text-slate-300 hover:text-red-500 text-sm transition-colors"><i class="fa-solid fa-trash-can"></i></button>
                </div>
                <p id="trip-dates" class="text-sm text-slate-500 mt-1">--</p>
            </div>
            <div class="flex items-center space-x-3">
                <div class="flex items-center bg-blue-50 border border-blue-200 rounded-full px-3 py-1 shadow-sm focus-within:ring-2 focus-within:ring-blue-300">
                    <i class="fa-solid fa-user-group text-blue-500 mr-2 text-xs"></i>
                    <span class="text-xs font-bold text-blue-700 mr-1">旅伴:</span>
                    <input type="text" id="companionInput" class="bg-transparent border-none focus:outline-none text-sm font-medium text-slate-700 placeholder-slate-400 w-32" placeholder="例如: 聖聖" oninput="saveCompanion(this.value)" onchange="renderBudget()">
                </div>
            </div>
        </header>

        <div class="bg-white border-b border-slate-200 px-8 flex space-x-6 text-sm font-medium text-slate-500 z-10">
            <button onclick="switchModule('timeline')" id="tab-timeline" class="module-tab py-4 text-blue-600 border-b-2 border-blue-600 font-bold">日曆與時間軸</button>
            <button onclick="switchModule('checklist')" id="tab-checklist" class="module-tab py-4 hover:text-blue-600 transition-colors">專業裝備行李</button>
            <button onclick="switchModule('map')" id="tab-map" class="module-tab py-4 hover:text-blue-600 transition-colors">交通與憑證</button>
            <button onclick="switchModule('budget')" id="tab-budget" class="module-tab py-4 hover:text-blue-600 transition-colors">預算與分帳</button>
        </div>

        <div class="flex-1 overflow-y-auto p-8">
            
            <div id="module-timeline" class="module-content block space-y-6 max-w-4xl mx-auto">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <div class="text-4xl text-blue-500 bg-blue-50 p-3 rounded-lg" id="weather-icon"><i class="fa-solid fa-cloud-sun"></i></div>
                        <div>
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">目的地即時氣象資訊</h3>
                            <div class="flex items-baseline space-x-2 mt-0.5">
                                <span id="temp-display" class="text-3xl font-black text-slate-700">--°C</span>
                                <span id="weather-desc" class="text-sm font-bold text-slate-500">連線中...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                    <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center"><i class="fa-solid fa-calendar-plus mr-2 text-blue-500"></i>規劃新行程項目</h3>
                    <div class="flex flex-col md:flex-row gap-3">
                        <input type="text" id="event-day" placeholder="天數" class="w-24 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                        <input type="time" id="event-time" class="border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                        <input type="text" id="event-title" placeholder="要做什麼？" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                        <input type="text" id="event-note" placeholder="備註/突發狀況" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                        <button onclick="addEvent()" class="bg-blue-600 text-white font-bold py-2 px-5 rounded-lg text-sm">新增</button>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <div id="itinerary-list" class="space-y-1"></div>
                </div>
            </div>

            <div id="module-checklist" class="module-content hidden max-w-4xl mx-auto space-y-6">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <div class="flex gap-2 mb-6">
                        <input type="text" id="newChecklistItem" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="要補帶什麼裝備嗎？">
                        <button onclick="addChecklistItem()" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-bold">新增打包項</button>
                    </div>
                    <div id="checklist-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>
            </div>

            <div id="module-map" class="module-content hidden max-w-4xl mx-auto space-y-6">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="transport-container"></div>
                </div>
            </div>

            <div id="module-budget" class="module-content hidden max-w-4xl mx-auto space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm flex flex-col justify-center">
                        <p class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-1">本次旅程總花費</p>
                        <p class="text-4xl font-black text-slate-800" id="budget-total">$0</p>
                    </div>
                    <div class="bg-emerald-50 rounded-xl p-6 border border-emerald-100 shadow-sm">
                        <p class="text-sm font-bold text-emerald-700 uppercase tracking-wider mb-3 flex items-center">
                            <i class="fa-solid fa-handshake-angle mr-2"></i>自動分帳結算結果
                        </p>
                        <div id="budget-settlement" class="text-emerald-900 font-medium space-y-2">
                            </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h3 class="font-bold text-lg text-slate-800 mb-4 flex items-center"><i class="fa-solid fa-calculator mr-2 text-emerald-500"></i>記一筆新的花費</h3>
                    <div class="flex flex-col md:flex-row gap-3 mb-6">
                        <input type="text" id="budget-title" placeholder="花費項目 (如: 買門票、租車尾款)" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500">
                        <input type="number" id="budget-amount" placeholder="金額 (AUD)" class="w-full md:w-32 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500">
                        <input type="text" id="budget-payer" placeholder="代墊人 (如: 中偉)" class="w-full md:w-32 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500">
                        <button onclick="addBudgetItem()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-lg text-sm font-bold transition-colors whitespace-nowrap">記帳</button>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">
                                    <th class="p-3">項目</th>
                                    <th class="p-3">代墊人</th>
                                    <th class="p-3 text-right">金額</th>
                                    <th class="p-3 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="budget-list" class="text-sm divide-y divide-slate-100">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <div id="newTripModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 mx-4">
            <h3 class="text-lg font-bold text-slate-800 mb-4">建立全新旅程計畫</h3>
            <div class="space-y-4">
                <input type="text" id="new-trip-name" placeholder="國家/行程目的地" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                <input type="text" id="new-trip-dates" placeholder="日期區間" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" step="any" id="new-trip-lat" placeholder="緯度" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                    <input type="number" step="any" id="new-trip-lng" placeholder="經度" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button onclick="closeNewTripModal()" class="px-4 py-2 text-sm font-medium text-slate-500">取消</button>
                <button onclick="createNewTrip()" class="px-5 py-2 text-sm font-bold bg-blue-600 text-white rounded-lg">確認建立</button>
            </div>
        </div>
    </div>

    <script>
        let currentTripKey = localStorage.getItem('activeTripKey') || 'tasmania';
        
        let tripsMaster = JSON.parse(localStorage.getItem('tripsMaster')) || {
            'tasmania': { name: '塔斯馬尼亞自駕與露營車', dates: '2026/01/13 - 2026/01/23', lat: -42.8821, lng: 147.3272, icon: 'fa-car' }
        };
        let itineraries = JSON.parse(localStorage.getItem('tripItinerariesV2')) || { 'tasmania': [] };
        let checklists = JSON.parse(localStorage.getItem('tripChecklists')) || { 'tasmania': [] };
        let transportDocs = JSON.parse(localStorage.getItem('tripTransportDocs')) || { 'tasmania': [] };
        let budgets = JSON.parse(localStorage.getItem('tripBudgets')) || { 'tasmania': [] };

        function renderSidebar() {
            const list = document.getElementById('sidebar-trip-list');
            list.innerHTML = '';
            Object.keys(tripsMaster).forEach(key => {
                const trip = tripsMaster[key];
                const isActive = key === currentTripKey;
                list.innerHTML += `
                    <li><button onclick="selectTrip('${key}')" class="w-full text-left px-3 py-2 rounded-lg font-medium text-sm transition-colors border flex flex-col ${isActive ? 'bg-blue-50 text-blue-700 border-blue-100 font-bold' : 'text-slate-600 border-transparent hover:bg-slate-50'}">
                        <span class="flex items-center"><i class="fa-solid ${trip.icon || 'fa-map'} w-5 mr-2"></i>${trip.name}</span>
                        <span class="text-xs opacity-60 mt-1 ml-7">${trip.dates.split(' ')[0]}</span>
                    </button></li>
                `;
            });
        }

        function selectTrip(key) { currentTripKey = key; localStorage.setItem('activeTripKey', key); renderSidebar(); initCurrentTripData(); }

        function initCurrentTripData() {
            const trip = tripsMaster[currentTripKey];
            if (!trip) return;
            document.getElementById('trip-title').innerText = trip.name;
            document.getElementById('trip-dates').innerText = trip.dates;
            document.getElementById('companionInput').value = localStorage.getItem(`companion_${currentTripKey}`) || '';
            fetchWeather(trip.lat, trip.lng);
            renderItinerary(); renderChecklist(); renderTransport(); renderBudget();
        }

        function openNewTripModal() { document.getElementById('newTripModal').classList.replace('hidden', 'flex'); }
        function closeNewTripModal() { document.getElementById('newTripModal').classList.replace('flex', 'hidden'); }
        function createNewTrip() {
            const name = document.getElementById('new-trip-name').value.trim();
            const dates = document.getElementById('new-trip-dates').value.trim();
            if (!name || !dates) return;
            const key = 'trip_' + Date.now();
            tripsMaster[key] = { name, dates, lat: -27.4698, lng: 153.0251, icon: 'fa-route' };
            itineraries[key] = []; checklists[key] = []; transportDocs[key] = []; budgets[key] = [];
            localStorage.setItem('tripsMaster', JSON.stringify(tripsMaster));
            currentTripKey = key; localStorage.setItem('activeTripKey', key);
            closeNewTripModal(); renderSidebar(); initCurrentTripData();
        }
        function deleteCurrentTrip() {
            if (Object.keys(tripsMaster).length <= 1) return alert('請至少保留一個行程');
            if (confirm(`確定要刪除「${tripsMaster[currentTripKey].name}」嗎？`)) {
                delete tripsMaster[currentTripKey];
                localStorage.setItem('tripsMaster', JSON.stringify(tripsMaster));
                currentTripKey = Object.keys(tripsMaster)[0];
                renderSidebar(); initCurrentTripData();
            }
        }
        function saveCompanion(value) { localStorage.setItem(`companion_${currentTripKey}`, value); }

        function renderItinerary() {
            const list = document.getElementById('itinerary-list');
            list.innerHTML = '';
            (itineraries[currentTripKey] || []).forEach(item => {
                list.innerHTML += `
                    <div data-id="${item.id}" class="relative pl-8 py-3 border-l-2 border-blue-200 bg-white group cursor-grab">
                        <span class="absolute -left-[9px] top-4.5 w-4 h-4 bg-blue-500 rounded-full border-4 border-white shadow-sm"></span>
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-xs font-bold text-slate-400">${item.day||''} ${item.time||''}</span>
                                <p class="font-semibold text-slate-800">${item.title}</p>
                                ${item.note ? `<p class="text-xs text-slate-500 mt-1 bg-slate-50 px-2 py-1 rounded inline-block">${item.note}</p>` : ''}
                            </div>
                            <button onclick="deleteEvent(${item.id})" class="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 p-2"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>`;
            });
        }
        function addEvent() {
            const title = document.getElementById('event-title').value.trim();
            if (!title) return;
            if (!itineraries[currentTripKey]) itineraries[currentTripKey] = [];
            itineraries[currentTripKey].push({ id: Date.now(), day: document.getElementById('event-day').value, time: document.getElementById('event-time').value, title, note: document.getElementById('event-note').value });
            localStorage.setItem('tripItinerariesV2', JSON.stringify(itineraries));
            renderItinerary();
        }
        function deleteEvent(id) { itineraries[currentTripKey] = itineraries[currentTripKey].filter(i => i.id !== id); localStorage.setItem('tripItinerariesV2', JSON.stringify(itineraries)); renderItinerary(); }
        new Sortable(document.getElementById('itinerary-list'), { animation: 150, onEnd: function (evt) { const arr = itineraries[currentTripKey]; arr.splice(evt.newIndex, 0, arr.splice(evt.oldIndex, 1)[0]); localStorage.setItem('tripItinerariesV2', JSON.stringify(itineraries)); } });

        function renderChecklist() {} function addChecklistItem() {} function renderTransport() {}
        
        // --- ★ 分帳演算法核心邏輯 ★ ---
        function renderBudget() {
            const list = document.getElementById('budget-list');
            list.innerHTML = '';
            const items = budgets[currentTripKey] || [];
            
            let totalAmount = 0;
            let paidByPerson = {}; 
            
            // 抓取名單：自己 + 填寫的旅伴
            const myName = "我";
            const companionName = document.getElementById('companionInput').value.trim();
            const participants = new Set([myName]);
            if (companionName) participants.add(companionName);

            // 算總花費 & 印出明細表
            items.forEach(item => {
                totalAmount += item.amount;
                const payer = item.payer || myName;
                participants.add(payer); // 如果有第三個人代墊，也加入名單
                
                paidByPerson[payer] = (paidByPerson[payer] || 0) + item.amount;

                list.innerHTML += `
                    <tr class="hover:bg-slate-50/50">
                        <td class="p-3 font-medium text-slate-700">${item.title}</td>
                        <td class="p-3 text-sm text-slate-500"><span class="bg-blue-50 text-blue-700 font-bold px-2 py-1 rounded">${payer}</span></td>
                        <td class="p-3 text-right font-bold text-slate-900">$${item.amount.toLocaleString()}</td>
                        <td class="p-3 text-center"><button onclick="deleteBudgetItem(${item.id})" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button></td>
                    </tr>`;
            });

            // 更新總花費大字
            document.getElementById('budget-total').innerText = '$' + totalAmount.toLocaleString();

            // 執行分帳計算
            const settlementContainer = document.getElementById('budget-settlement');
            if (totalAmount === 0) {
                settlementContainer.innerHTML = '<span class="text-slate-400">目前還沒有花費紀錄喔！</span>';
                return;
            }

            // 計算每人平均應付多少
            const perPersonShare = totalAmount / participants.size;
            let balances = {}; // 正數代表別人欠他錢，負數代表他欠別人錢

            participants.forEach(p => {
                const paid = paidByPerson[p] || 0;
                balances[p] = paid - perPersonShare;
            });

            // 將人分為「欠錢的(Debtors)」和「該收錢的(Creditors)」
            let debtors = [];
            let creditors = [];
            for (const [person, balance] of Object.entries(balances)) {
                if (balance < -0.01) debtors.push({ person, amount: Math.abs(balance) });
                else if (balance > 0.01) creditors.push({ person, amount: balance });
            }

            // 產生結算文字
            let settlementText = '';
            let i = 0, j = 0;
            while(i < debtors.length && j < creditors.length) {
                let d = debtors[i];
                let c = creditors[j];
                let amountToPay = Math.min(d.amount, c.amount);
                
                settlementText += `<div class="flex justify-between items-center bg-white px-4 py-2 rounded-lg shadow-sm">
                                    <span><b>${d.person}</b> 應給 <b>${c.person}</b></span>
                                    <span class="font-black text-lg">$${Math.round(amountToPay).toLocaleString()}</span>
                                   </div>`;
                
                d.amount -= amountToPay;
                c.amount -= amountToPay;
                if(d.amount < 0.01) i++;
                if(c.amount < 0.01) j++;
            }

            settlementContainer.innerHTML = settlementText || '<span class="text-emerald-600 font-bold">大家付的錢剛剛好，互不相欠！</span>';
        }

        function addBudgetItem() {
            const title = document.getElementById('budget-title').value.trim();
            const amount = parseFloat(document.getElementById('budget-amount').value);
            const payer = document.getElementById('budget-payer').value.trim() || '我';
            if (!title || isNaN(amount)) return alert('請填寫項目與金額');
            if (!budgets[currentTripKey]) budgets[currentTripKey] = [];
            budgets[currentTripKey].push({ id: Date.now(), title, amount, payer });
            localStorage.setItem('tripBudgets', JSON.stringify(budgets));
            document.getElementById('budget-title').value = '';
            document.getElementById('budget-amount').value = '';
            document.getElementById('budget-payer').value = '';
            renderBudget();
        }

        function deleteBudgetItem(id) { budgets[currentTripKey] = budgets[currentTripKey].filter(i => i.id !== id); localStorage.setItem('tripBudgets', JSON.stringify(budgets)); renderBudget(); }
        async function fetchWeather(lat, lng) {} function switchModule(m) { document.querySelectorAll('.module-content').forEach(e => e.classList.replace('block', 'hidden')); document.getElementById('module-'+m).classList.replace('hidden', 'block'); document.querySelectorAll('.module-tab').forEach(e => e.classList.remove('text-blue-600', 'border-b-2', 'font-bold')); document.getElementById('tab-'+m).classList.add('text-blue-600', 'border-b-2', 'font-bold'); }

        renderSidebar(); initCurrentTripData();
    </script>
</body>
</html>
