<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的旅遊行程總管</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 flex h-screen overflow-hidden">

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col z-10">
        <div class="p-6 border-b border-slate-100">
            <h1 class="text-xl font-extrabold text-blue-600"><i class="fa-solid fa-plane-departure mr-2"></i>TripManager</h1>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 space-y-6">
            <div>
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">即將到來</h2>
                <ul class="space-y-2">
                    <li>
                        <button onclick="loadTrip(this, 'bali', '峇里島潛水與自然探索', '2026/06/29 - 2026/07/12 (共14天)', -8.4095, 115.1889)" class="sidebar-trip w-full text-left px-3 py-2 bg-blue-50 text-blue-700 rounded-lg font-medium text-sm transition-colors border border-blue-100">
                            <i class="fa-solid fa-water w-5 text-center mr-1"></i> 峇里島潛水與自然探索
                            <span class="block text-xs opacity-70 mt-1 ml-6">2026/06/29</span>
                        </button>
                    </li>
                    <li>
                        <button onclick="loadTrip(this, 'thai', '泰國 Tomorrowland', '2026/12/09 - 2026/12/18 (共10天)', 12.9236, 100.8825)" class="sidebar-trip w-full text-left px-3 py-2 text-slate-600 hover:bg-slate-50 rounded-lg font-medium text-sm transition-colors border border-transparent">
                            <i class="fa-solid fa-music w-5 text-center mr-1"></i> 泰國 Tomorrowland 
                            <span class="block text-xs opacity-70 mt-1 ml-6">2026/12/09</span>
                        </button>
                    </li>
                </ul>
            </div>

            <div>
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">歷史行程</h2>
                <ul class="space-y-2">
                    <li>
                        <button onclick="loadTrip(this, 'tasmania', '塔斯馬尼亞自駕遊', '2026/01/13 - 2026/01/23 (共11天)', -42.8821, 147.3272)" class="sidebar-trip w-full text-left px-3 py-2 text-slate-600 hover:bg-slate-50 rounded-lg font-medium text-sm transition-colors border border-transparent">
                            <i class="fa-solid fa-car w-5 text-center mr-1"></i> 塔斯馬尼亞自駕遊
                            <span class="block text-xs opacity-70 mt-1 ml-6">2026/01/13</span>
                        </button>
                    </li>
                    <li>
                        <button onclick="loadTrip(this, 'maldives', '馬爾地夫潛水行', '2025/04/25 - 2025/04/28 (共4天)', 3.9416, 73.4904)" class="sidebar-trip w-full text-left px-3 py-2 text-slate-600 hover:bg-slate-50 rounded-lg font-medium text-sm transition-colors border border-transparent">
                            <i class="fa-solid fa-fish-fins w-5 text-center mr-1"></i> 馬爾地夫潛水行
                            <span class="block text-xs opacity-70 mt-1 ml-6">2025/04/25</span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
        
        <div class="p-4 border-t border-slate-200">
            <button class="w-full bg-slate-800 hover:bg-slate-700 text-white py-2 rounded-lg text-sm font-bold shadow-sm transition-colors">
                <i class="fa-solid fa-plus mr-2"></i>建立新行程
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden bg-slate-50 relative">
        <header class="bg-white border-b border-slate-200 px-8 py-5 flex justify-between items-center z-10 shadow-sm">
            <div>
                <h2 id="trip-title" class="text-2xl font-bold text-slate-800">峇里島潛水與自然探索</h2>
                <p id="trip-dates" class="text-sm text-slate-500 mt-1">2026/06/29 - 2026/07/12 (共14天)</p>
            </div>
            
            <div class="flex items-center space-x-3">
                <span class="bg-green-100 text-green-700 px-3 py-1.5 rounded-full text-xs font-bold flex items-center shadow-sm">
                    <i class="fa-solid fa-cloud-sun mr-1"></i>天氣預測已更新
                </span>
                
                <div class="flex items-center bg-blue-50 border border-blue-200 rounded-full px-3 py-1 shadow-sm transition-all focus-within:ring-2 focus-within:ring-blue-300">
                    <i class="fa-solid fa-user-group text-blue-500 mr-2 text-xs"></i>
                    <span class="text-xs font-bold text-blue-700 mr-1">旅伴:</span>
                    <input type="text" id="companionInput" class="bg-transparent border-none focus:outline-none text-sm font-medium text-slate-700 placeholder-slate-400 w-28" placeholder="輸入同行者..." oninput="saveCompanion(this.value)">
                </div>
            </div>
        </header>

        <div class="bg-white border-b border-slate-200 px-8 flex space-x-6 text-sm font-medium text-slate-500 z-10">
            <button onclick="switchModule('timeline')" id="tab-timeline" class="module-tab py-4 text-blue-600 border-b-2 border-blue-600 font-bold">日曆視圖</button>
            <button onclick="switchModule('checklist')" id="tab-checklist" class="module-tab py-4 hover:text-blue-600 transition-colors">裝備清單</button>
            <button onclick="switchModule('map')" id="tab-map" class="module-tab py-4 hover:text-blue-600 transition-colors">交通與地圖</button>
            <button onclick="switchModule('budget')" id="tab-budget" class="module-tab py-4 hover:text-blue-600 transition-colors">預算與分帳</button>
        </div>

        <div class="flex-1 overflow-y-auto p-8">
            
            <div id="module-timeline" class="module-content block space-y-6 max-
